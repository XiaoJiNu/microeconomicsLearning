<polygon points="110,420 110,100 670,420" fill="#ccfbf1" opacity="0.72" />
<line x1="110" y1="420" x2="838" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
<line x1="110" y1="420" x2="110" y2="89" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
