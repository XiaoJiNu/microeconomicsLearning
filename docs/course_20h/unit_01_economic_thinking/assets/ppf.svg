<line x1="110" y1="180" x2="810" y2="180" stroke="#e2e8f0" /><text x="91" y="186" font-size="18" text-anchor="end">6</text>
<line x1="110" y1="100" x2="810" y2="100" stroke="#e2e8f0" /><text x="91" y="106" font-size="18" text-anchor="end">8</text>
<line x1="110" y1="100" x2="110" y2="420" stroke="#e2e8f0" /><text x="110" y="446" font-size="18" text-anchor="middle">0</text>
<line x1="250" y1="100" x2="250" y2="420" stroke="#e2e8f0" /><text x="250" y="446" font-size="18" text-anchor="middle">1</text>
<line x1="390" y1="100" x2="390" y2="420" stroke="#e2e8f0" /><text x="390" y="446" font-size="18" text-anchor="middle">2</text>
