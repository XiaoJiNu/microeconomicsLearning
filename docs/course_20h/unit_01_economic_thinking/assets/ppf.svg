<text x="30" y="330" font-size="18" transform="rotate(-90 30 330)">Checks (batches/week)</text><text x="827" y="478" font-size="19" text-anchor="end">Experiments (runs/week)</text>
<circle cx="110" cy="100" r="6" fill="#0f766e" /><text x="129" y="99" font-size="20" fill="#0f766e">A (0, 8)</text>
<circle cx="390" cy="260" r="6" fill="#0f766e" /><text x="385" y="242" font-size="20" fill="#0f766e">B (2, 4)</text>
