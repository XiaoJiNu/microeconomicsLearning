<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">生产可能性边界：四小时的资源约束</title><desc id="desc">横轴为每周实验次数，纵轴为每周质检批数。边界连接零次实验八批质检与四次实验零批质检，点B为两次实验四批质检；内部点I为一次实验三批质检；外部点O为三次实验五批质检。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155" /></marker></defs><rect width="900" height="520" fill="#f8fafc" /><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a"><text x="35" y="40" font-size="26" font-weight="700">Production possibilities frontier (PPF)</text><text x="35" y="72" font-size="17" fill="#475569">Weekly capacity: 4 hours | 1 hour/run | 0.5 hour/check batch</text>
<line x1="110" y1="420" x2="810" y2="420" stroke="#e2e8f0" /><text x="91" y="426" font-size="18" text-anchor="end">0</text>
