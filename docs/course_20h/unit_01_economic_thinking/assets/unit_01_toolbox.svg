<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">单元工具箱：四个工具支持一份决策说明</title>
<desc id="desc">中央是可检查的决策说明，四周四个工具汇入：机会成本（找最佳被放弃用途）、沉没成本（只看现在还能改变什么）、边际分析（每个新增单位单独比较）、因果证据（结论需要可信反事实）。</desc>
<defs><marker id="ar13" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#334155"/></marker></defs>
<rect width="900" height="520" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="26" font-weight="700">Unit 01 toolbox: four tools, one decision memo</text>

<rect x="310" y="200" width="280" height="110" rx="12" fill="#334155"/>
<text x="450" y="240" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="700">Checkable</text>
<text x="450" y="268" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="700">decision memo</text>
<text x="450" y="293" font-size="13" text-anchor="middle" fill="#cbd5e1">options, numbers, evidence, conditions</text>

<rect x="60" y="100" width="220" height="86" rx="10" fill="#dbeafe"/>
<text x="170" y="130" font-size="16" text-anchor="middle" font-weight="700" fill="#1d4ed8">Opportunity cost</text>
<text x="170" y="154" font-size="13" text-anchor="middle" fill="#1d4ed8">best forgone option only</text>
<text x="170" y="173" font-size="13" text-anchor="middle" fill="#1d4ed8">never double-count</text>
<line x1="280" y1="150" x2="360" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar13)"/>

<rect x="620" y="100" width="220" height="86" rx="10" fill="#ccfbf1"/>
<text x="730" y="130" font-size="16" text-anchor="middle" font-weight="700" fill="#0f766e">Sunk cost</text>
<text x="730" y="154" font-size="13" text-anchor="middle" fill="#0f766e">can this choice still change it?</text>
<text x="730" y="173" font-size="13" text-anchor="middle" fill="#0f766e">if not, set it aside</text>
<line x1="620" y1="150" x2="540" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar13)"/>

<rect x="60" y="330" width="220" height="86" rx="10" fill="#fef3c7"/>
<text x="170" y="360" font-size="16" text-anchor="middle" font-weight="700" fill="#92600a">Marginal analysis</text>
<text x="170" y="384" font-size="13" text-anchor="middle" fill="#92600a">MB vs MC of the NEXT unit</text>
<text x="170" y="403" font-size="13" text-anchor="middle" fill="#92600a">not the average so far</text>
<line x1="280" y1="365" x2="360" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#ar13)"/>

<rect x="620" y="330" width="220" height="86" rx="10" fill="#fee2e2"/>
<text x="730" y="360" font-size="16" text-anchor="middle" font-weight="700" fill="#b91c1c">Causal evidence</text>
<text x="730" y="384" font-size="13" text-anchor="middle" fill="#b91c1c">needs a credible</text>
<text x="730" y="403" font-size="13" text-anchor="middle" fill="#b91c1c">counterfactual</text>
<line x1="620" y1="365" x2="540" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#ar13)"/>

<text x="450" y="470" font-size="15" text-anchor="middle" fill="#475569">Plus the habit from every lesson: classify the claim (micro/macro, positive/normative) before arguing about it.</text>
</g></svg>