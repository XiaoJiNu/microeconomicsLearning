<text x="863" y="462" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500">卖家 3</text>
<line x1="848" y1="203" x2="878" y2="233" stroke="#c0392b" stroke-width="5" stroke-linecap="round" filter="url(#wob)"/>
