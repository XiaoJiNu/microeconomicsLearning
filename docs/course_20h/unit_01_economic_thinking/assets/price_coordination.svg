<line x1="80" y1="305" x2="900" y2="305" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="16 10" filter="url(#wob)"/>
<rect x="386" y="275" width="188" height="44" rx="22" fill="white" stroke="#c0392b" stroke-width="3.5" filter="url(#wob)"/>
<text x="480" y="307" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">价格 P = 125</text>
<text x="480" y="502" font-size="20" fill="#3b3734" text-anchor="middle" font-weight="700">✓ 成交 2 单位：总好处 = (180+140) − (60+110) = 150</text>
<rect x="48" y="522" width="864" height="58" rx="18" fill="#fff3c4" stroke="#3b3734" stroke-width="3.5" filter="url(#wob)"/>
<polygon points="78.0,538.0 81.4,546.3 90.4,547.0 83.6,552.8 85.6,561.5 78.0,556.9 70.4,561.5 72.4,552.8 65.6,547.0 74.6,546.3" fill="#e67e22" stroke="#3b3734" stroke-width="2" filter="url(#wob)"/>
<text x="104" y="559" font-size="19.5" fill="#3b3734" text-anchor="start" font-weight="700">买家付的 125 就是卖家收的 125——价格分配好处，它不创造好处。</text>
