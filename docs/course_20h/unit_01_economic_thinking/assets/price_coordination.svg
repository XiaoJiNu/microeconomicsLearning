<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">价格协调：谁买谁卖由各自的数值决定</title><desc id="d">买家愿付180、140、90，卖家成本60、110、160；价格125让前两位买家和前两位卖家成交。</desc>
<defs><filter id="wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="66" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/></filter></defs>
<rect width="960" height="600" fill="#fdf6e9"/>
<g font-family="'Segoe Print','Ma Shan Zheng','Xingkai SC','STXingkai','Kaiti SC','STKaiti','KaiTi','Noto Sans CJK SC',cursive" fill="#3b3734">
<rect x="40" y="51.76" width="277.92" height="17.6" fill="#ffe082" opacity="0.75" filter="url(#wob)"/>
<text x="48" y="62" font-size="32" fill="#3b3734" text-anchor="start" font-weight="700">一个价格，怎样协调陌生人？</text>
<path d="M 42 72 q 128.96 8 273.92 0" fill="none" stroke="#3b3734" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
