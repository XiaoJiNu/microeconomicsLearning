<text x="710" y="112" font-size="21" fill="#1e8449" text-anchor="middle" font-weight="700">卖家：多卖一件的成本</text>
<rect x="110" y="250" width="86" height="180" rx="10" fill="#d6eaf8" stroke="#2471a3" stroke-width="3.5" filter="url(#wob)"/>
<text x="153" y="234" font-size="21" fill="#2471a3" text-anchor="middle" font-weight="700">180</text>
<text x="153" y="462" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500">买家 1</text>
