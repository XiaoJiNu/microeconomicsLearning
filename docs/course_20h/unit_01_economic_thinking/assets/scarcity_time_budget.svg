<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">稀缺：同一段时间只能用一次</title><desc id="d">今晚两小时被三个互斥方案争夺：学经济学、兼职、运动休息，每个方案都占满两小时，不可兼得。</desc>
<defs><filter id="wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/></filter></defs>
<rect width="960" height="600" fill="#fdf6e9"/>
<g font-family="'Segoe Print','Ma Shan Zheng','Xingkai SC','STXingkai','Kaiti SC','STKaiti','KaiTi','Noto Sans CJK SC',cursive" fill="#3b3734">
<rect x="40" y="51.76" width="476.32" height="17.6" fill="#ffe082" opacity="0.75" filter="url(#wob)"/>
<text x="48" y="62" font-size="32" fill="#3b3734" text-anchor="start" font-weight="700">稀缺 Scarcity：同一段时间，只能用一次</text>
<path d="M 42 72 q 228.16 8 472.32 0" fill="none" stroke="#3b3734" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<circle cx="872" cy="66" r="30" fill="white" stroke="#3b3734" stroke-width="3.5" filter="url(#wob)"/>
<line x1="872" y1="66" x2="872" y2="46" stroke="#3b3734" stroke-width="3" stroke-linecap="round" filter="url(#wob)"/>
<line x1="872" y1="66" x2="888" y2="74" stroke="#3b3734" stroke-width="3" stroke-linecap="round" filter="url(#wob)"/>
<line x1="150" y1="118" x2="810" y2="118" stroke="#3b3734" stroke-width="4" stroke-linecap="round" filter="url(#wob)"/>
<line x1="150" y1="106" x2="150" y2="130" stroke="#3b3734" stroke-width="4" stroke-linecap="round" filter="url(#wob)"/>
<line x1="810" y1="106" x2="810" y2="130" stroke="#3b3734" stroke-width="4" stroke-linecap="round" filter="url(#wob)"/>
<text x="480" y="104" font-size="21" fill="#3b3734" text-anchor="middle" font-weight="700">今晚 19:00 – 21:00 · 一共 2 小时</text>
<rect x="190" y="160" width="470" height="76" rx="20" fill="#d6eaf8" stroke="#2471a3" stroke-width="3.5" filter="url(#wob)"/>
<circle cx="160" cy="198" r="24" fill="white" stroke="#2471a3" stroke-width="3.5" filter="url(#wob)"/>
<text x="160" y="207" font-size="26" fill="#2471a3" text-anchor="middle" font-weight="700">A</text>
<text x="214" y="196" font-size="23" fill="#3b3734" text-anchor="start" font-weight="700">学经济学</text>
<text x="214" y="222" font-size="17" fill="#7f8c8d" text-anchor="start" font-weight="500">占满全部 2 小时</text>
<rect x="190" y="262" width="470" height="76" rx="20" fill="#d5f5e3" stroke="#1e8449" stroke-width="3.5" filter="url(#wob)"/>
<circle cx="160" cy="300" r="24" fill="white" stroke="#1e8449" stroke-width="3.5" filter="url(#wob)"/>
<text x="160" y="309" font-size="26" fill="#1e8449" text-anchor="middle" font-weight="700">B</text>
<text x="214" y="298" font-size="23" fill="#3b3734" text-anchor="start" font-weight="700">接一单兼职</text>
<text x="214" y="324" font-size="17" fill="#7f8c8d" text-anchor="start" font-weight="500">占满全部 2 小时</text>
<rect x="190" y="364" width="470" height="76" rx="20" fill="#fdebd0" stroke="#e67e22" stroke-width="3.5" filter="url(#wob)"/>
<circle cx="160" cy="402" r="24" fill="white" stroke="#e67e22" stroke-width="3.5" filter="url(#wob)"/>
<text x="160" y="411" font-size="26" fill="#e67e22" text-anchor="middle" font-weight="700">C</text>
<text x="214" y="400" font-size="23" fill="#3b3734" text-anchor="start" font-weight="700">运动 + 休息</text>
<text x="214" y="426" font-size="17" fill="#7f8c8d" text-anchor="start" font-weight="500">占满全部 2 小时</text>
<text x="700" y="210" font-size="23" fill="#c0392b" text-anchor="start" font-weight="700">A + B + C</text>
<text x="700" y="240" font-size="23" fill="#c0392b" text-anchor="start" font-weight="700">需要 6 小时</text>
<text x="700" y="278" font-size="19" fill="#c0392b" text-anchor="start" font-weight="500">这个晚上</text>
<text x="700" y="304" font-size="19" fill="#c0392b" text-anchor="start" font-weight="500">不会变长</text>
<line x1="852" y1="198" x2="904" y2="250" stroke="#c0392b" stroke-width="5" stroke-linecap="round" filter="url(#wob)"/>
<line x1="852" y1="250" x2="904" y2="198" stroke="#c0392b" stroke-width="5" stroke-linecap="round" filter="url(#wob)"/>
<line x1="690" y1="320" x2="672" y2="320" stroke="#c0392b" stroke-width="3" stroke-linecap="round" filter="url(#wob)"/>
<path d="M 686.5 313.2 L 672 320 L 686.5 326.8" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<text x="700" y="350" font-size="18" fill="#3b3734" text-anchor="start" font-weight="500">选了 A，</text>
<text x="700" y="374" font-size="18" fill="#3b3734" text-anchor="start" font-weight="500">B、C 就消失了</text>
<rect x="48" y="522" width="864" height="58" rx="18" fill="#fff3c4" stroke="#3b3734" stroke-width="3.5" filter="url(#wob)"/>
<polygon points="78.0,538.0 81.4,546.3 90.4,547.0 83.6,552.8 85.6,561.5 78.0,556.9 70.4,561.5 72.4,552.8 65.6,547.0 74.6,546.3" fill="#e67e22" stroke="#3b3734" stroke-width="2" filter="url(#wob)"/>
<text x="104" y="559" font-size="19.5" fill="#3b3734" text-anchor="start" font-weight="700">选一个 = 放弃另外两个里最好的那个。稀缺不是穷，是用途互斥。</text>
</g></svg>
