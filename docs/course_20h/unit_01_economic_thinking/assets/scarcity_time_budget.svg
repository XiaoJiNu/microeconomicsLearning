<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">权衡取舍的三个层次</title>
  <desc id="d">个人时间、家庭收入、社会资源三个层面的权衡取舍示例：选择一种用途就要放弃另一种用途。</desc>

  <!-- 背景 -->
  <rect width="900" height="560" rx="18" fill="#fdfcf8"/>
  <rect x="1" y="1" width="898" height="558" rx="17" fill="none" stroke="#e7e2d6" stroke-width="2"/>

  <!-- 字体统一 -->
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">

    <!-- 标题区 -->
    <text x="450" y="52" text-anchor="middle" font-size="15" fill="#b45309" letter-spacing="4">原理一 · 人们面临权衡取舍</text>
    <text x="450" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2937">选了 A，就意味着放弃 B</text>

    <!-- 格言胶囊 -->
    <rect x="330" y="108" width="240" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="450" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">“天下没有免费的午餐”</text>

    <!-- ===== 第一行：个人 ===== -->
    <rect x="50" y="168" width="800" height="96" rx="12" fill="#ffffff" stroke="#e7e2d6" stroke-width="1.5"/>
    <rect x="74" y="192" width="88" height="48" rx="10" fill="#dbeafe"/>
    <text x="118" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">个人</text>
    <text x="118" y="233" text-anchor="middle" font-size="12" fill="#3b82f6">1 小时</text>
    <text x="186" y="200" font-size="15" fill="#374151">一小时用来<tspan font-weight="700" fill="#1d4ed8">学经济学</tspan>，就不能同时用来：</text>
    <rect x="186" y="214" width="118" height="34" rx="17" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="245" y="236" text-anchor="middle" font-size="14" fill="#4b5563">学心理学</text>
    <rect x="316" y="214" width="100" height="34" rx="17" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="366" y="236" text-anchor="middle" font-size="14" fill="#4b5563">打个盹</text>
    <rect x="428" y="214" width="100" height="34" rx="17" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="478" y="236" text-anchor="middle" font-size="14" fill="#4b5563">骑车</text>
    <rect x="540" y="214" width="130" height="34" rx="17" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="605" y="236" text-anchor="middle" font-size="14" fill="#4b5563">兼职赚零花钱</text>
    <text x="826" y="236" text-anchor="end" font-size="13" fill="#9ca3af">用途互斥</text>

    <!-- ===== 第二行：家庭 ===== -->
    <rect x="50" y="282" width="800" height="96" rx="12" fill="#ffffff" stroke="#e7e2d6" stroke-width="1.5"/>
    <rect x="74" y="306" width="88" height="48" rx="10" fill="#ccfbf1"/>
    <text x="118" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">家庭</text>
    <text x="118" y="347" text-anchor="middle" font-size="12" fill="#14b8a6">1 美元</text>
    <text x="186" y="314" font-size="15" fill="#374151">收入多花 1 美元在<tspan font-weight="700" fill="#0f766e">食物 · 衣物 · 度假</tspan>上，</text>
    <text x="186" y="338" font-size="15" fill="#374151">就要在<tspan font-weight="700" fill="#0f766e">退休储蓄 · 子女教育储蓄</tspan>上少花 1 美元</text>
    <text x="826" y="350" text-anchor="end" font-size="13" fill="#9ca3af">此消彼长</text>

    <!-- ===== 第三行：社会 ===== -->
    <rect x="50" y="396" width="800" height="108" rx="12" fill="#ffffff" stroke="#e7e2d6" stroke-width="1.5"/>
    <rect x="74" y="426" width="88" height="48" rx="10" fill="#ffedd5"/>
    <text x="118" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">社会</text>
    <text x="118" y="467" text-anchor="middle" font-size="12" fill="#ea580c">总支出</text>
    <!-- 三对经典取舍 -->
    <g font-size="14.5">
      <rect x="186" y="412" width="150" height="32" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="261" y="433" text-anchor="middle" fill="#4b5563">大炮（国防）</text>
      <text x="352" y="433" text-anchor="middle" font-size="16" fill="#b45309">⚖</text>
      <rect x="366" y="412" width="150" height="32" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="441" y="433" text-anchor="middle" fill="#4b5563">黄油（消费品）</text>

      <rect x="186" y="452" width="150" height="32" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="261" y="473" text-anchor="middle" fill="#4b5563">清洁的环境</text>
      <text x="352" y="473" text-anchor="middle" font-size="16" fill="#b45309">⚖</text>
      <rect x="366" y="452" width="150" height="32" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="441" y="473" text-anchor="middle" fill="#4b5563">高收入水平</text>

      <rect x="560" y="412" width="130" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="625" y="433" text-anchor="middle" fill="#92400e">效率 · 蛋糕做大</text>
      <text x="704" y="433" text-anchor="middle" font-size="16" fill="#b45309">⚖</text>
      <rect x="716" y="412" width="120" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="776" y="433" text-anchor="middle" fill="#92400e">平等 · 均分</text>
      <text x="560" y="473" font-size="13" fill="#9ca3af">政府政策常在这两个目标之间冲突</text>
    </g>

    <!-- 底部结论条 -->
    <rect x="50" y="518" width="800" height="1.5" fill="#e7e2d6"/>
    <text x="450" y="543" text-anchor="middle" font-size="14.5" fill="#6b7280">认识到权衡取舍 <tspan font-weight="700" fill="#b45309">不会替你做出选择</tspan>，但了解选择是做出良好决策的前提</text>
  </g>
</svg>
