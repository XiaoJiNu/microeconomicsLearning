<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">两把尺子：微观还是宏观，实证还是规范</title>
<desc id="desc">二乘二表格。列是微观与宏观，行是实证与规范。微观实证：提高停车费会减少这里的停车；微观规范：中心城区应该提高停车费；宏观实证：货币扩张会推高总体物价；宏观规范：央行应该把就业放在物价前面。</desc>
<rect width="900" height="520" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="26" font-weight="700">Two axes before any debate: level and kind</text>
<text x="40" y="78" font-size="16" fill="#475569">Micro or macro? Positive (testable) or normative (value)? Classify first, argue second.</text>

<rect x="270" y="110" width="280" height="52" fill="#334155"/>
<text x="410" y="143" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="700">Microeconomics</text>
<rect x="570" y="110" width="280" height="52" fill="#334155"/>
<text x="710" y="143" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="700">Macroeconomics</text>

<rect x="60" y="180" width="190" height="130" fill="#0f766e"/>
<text x="155" y="230" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">Positive</text>
<text x="155" y="256" font-size="14" text-anchor="middle" fill="#d7f0ea">what is / will be</text>
<text x="155" y="278" font-size="14" text-anchor="middle" fill="#d7f0ea">testable</text>

<rect x="60" y="330" width="190" height="130" fill="#d89a20"/>
<text x="155" y="380" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="700">Normative</text>
<text x="155" y="406" font-size="14" text-anchor="middle" fill="#fdf3d7">what should be</text>
<text x="155" y="428" font-size="14" text-anchor="middle" fill="#fdf3d7">value ranking</text>

<rect x="270" y="180" width="280" height="130" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="410" y="225" font-size="15" text-anchor="middle" fill="#0f172a">"Higher parking fees reduce</text>
<text x="410" y="250" font-size="15" text-anchor="middle" fill="#0f172a">parking in this district."</text>
<text x="410" y="285" font-size="13" text-anchor="middle" fill="#475569">one market, checkable prediction</text>

<rect x="570" y="180" width="280" height="130" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="710" y="225" font-size="15" text-anchor="middle" fill="#0f172a">"Money expansion pushes up</text>
<text x="710" y="250" font-size="15" text-anchor="middle" fill="#0f172a">the overall price level."</text>
<text x="710" y="285" font-size="13" text-anchor="middle" fill="#475569">economy-wide, still testable</text>

<rect x="270" y="330" width="280" height="130" fill="#ffffff" stroke="#d89a20" stroke-width="2"/>
<text x="410" y="375" font-size="15" text-anchor="middle" fill="#0f172a">"The city SHOULD raise</text>
<text x="410" y="400" font-size="15" text-anchor="middle" fill="#0f172a">parking fees."</text>
<text x="410" y="435" font-size="13" text-anchor="middle" fill="#475569">value goal needed: congestion? fairness?</text>

<rect x="570" y="330" width="280" height="130" fill="#ffffff" stroke="#d89a20" stroke-width="2"/>
<text x="710" y="375" font-size="15" text-anchor="middle" fill="#0f172a">"The central bank SHOULD put</text>
<text x="710" y="400" font-size="15" text-anchor="middle" fill="#0f172a">jobs before prices."</text>
<text x="710" y="435" font-size="13" text-anchor="middle" fill="#475569">a ranking of values, not a fact</text>

<text x="40" y="505" font-size="14" fill="#475569">Positive is not "proven" and normative is not "irrational": they answer different kinds of questions.</text>
</g></svg>