<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc"><title id="title">家庭和企业的实物流与货币流</title><desc id="desc">左图：家庭提供生产要素，经要素市场流向企业；企业生产商品，经产品市场流向家庭。右图：消费支出从家庭经产品市场流向企业，要素收入从企业经要素市场流向家庭，与实物流方向相反。</desc><defs><marker id="real" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#0f766e" /></marker><marker id="money" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#b45309" /></marker></defs><rect width="1000" height="465" fill="#f8fafc" /><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a"><text x="32" y="39" font-size="25" font-weight="700">Every exchange has two opposite flows</text><line x1="500" y1="70" x2="500" y2="415" stroke="#cbd5e1" />
<g transform="translate(0,0)"><text x="250" y="79" font-size="21" text-anchor="middle" fill="#0f766e">Real flows</text>
<rect x="30" y="222" width="110" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="85.0" y="258.0" text-anchor="middle" font-size="18">Households</text>
<rect x="360" y="222" width="110" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="415.0" y="258.0" text-anchor="middle" font-size="20">Firms</text>
<rect x="168" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="250.0" y="141.0" text-anchor="middle" font-size="20">Product market</text>
<rect x="156" y="346" width="188" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="250.0" y="377.0" text-anchor="middle" font-size="20">Factor market</text>
<line x1="382" y1="215" x2="313" y2="163" stroke="#0f766e" stroke-width="3" marker-end="url(#real)" />
<line x1="185" y1="163" x2="119" y2="216" stroke="#0f766e" stroke-width="3" marker-end="url(#real)" />
<line x1="120" y1="287" x2="186" y2="339" stroke="#0f766e" stroke-width="3" marker-end="url(#real)" />
<line x1="316" y1="339" x2="382" y2="287" stroke="#0f766e" stroke-width="3" marker-end="url(#real)" />
<text x="412" y="183" text-anchor="middle" font-size="14" fill="#0f766e">Goods / services</text>
<text x="92" y="183" text-anchor="middle" font-size="14" fill="#0f766e">Goods / services</text>
<text x="92" y="324" text-anchor="middle" font-size="14" fill="#0f766e">Labor / assets</text>
<text x="412" y="324" text-anchor="middle" font-size="14" fill="#0f766e">Labor / assets</text>
</g>
<g transform="translate(500,0)"><text x="250" y="79" font-size="21" text-anchor="middle" fill="#b45309">Money flows</text>
<rect x="30" y="222" width="110" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="85.0" y="258.0" text-anchor="middle" font-size="18">Households</text>
<rect x="360" y="222" width="110" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="415.0" y="258.0" text-anchor="middle" font-size="20">Firms</text>
<rect x="168" y="110" width="164" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="250.0" y="141.0" text-anchor="middle" font-size="20">Product market</text>
<rect x="156" y="346" width="188" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" /><text x="250.0" y="377.0" text-anchor="middle" font-size="20">Factor market</text>
<line x1="119" y1="216" x2="185" y2="163" stroke="#b45309" stroke-width="3" marker-end="url(#money)" />
<line x1="313" y1="163" x2="382" y2="215" stroke="#b45309" stroke-width="3" marker-end="url(#money)" />
<line x1="382" y1="287" x2="316" y2="339" stroke="#b45309" stroke-width="3" marker-end="url(#money)" />
