<text x="92" y="324" text-anchor="middle" font-size="14" fill="#b45309">Income</text>
</g>
<text x="500" y="443" text-anchor="middle" font-size="17" fill="#475569">Simplified model: government, trade, finance, saving and investment omitted.</text></g></svg>