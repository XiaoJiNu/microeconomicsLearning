<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">激励链条：规则改变相对得失，相对得失改变行为</title>
<desc id="desc">四个方框依次相连：规则变化（奖金按样本总数）到相对得失变化（普通样本省力且同样计奖）到行为响应（普通场景90升到190，罕见场景仍是10）到目标偏离（总数翻倍，罕见场景覆盖没变）。</desc>
<defs><marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#334155"/></marker></defs>
<rect width="900" height="520" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="26" font-weight="700">Incentives: rule to payoff, payoff to behavior</text>
<text x="40" y="78" font-size="16" fill="#475569">Annotation team case: bonus tied to total submitted samples.</text>

<rect x="40" y="150" width="185" height="110" rx="10" fill="#dbeafe"/>
<text x="132" y="180" font-size="16" text-anchor="middle" font-weight="700" fill="#1d4ed8">1. Rule change</text>
<text x="132" y="206" font-size="14" text-anchor="middle" fill="#1d4ed8">bonus per total</text>
<text x="132" y="228" font-size="14" text-anchor="middle" fill="#1d4ed8">sample count</text>

<line x1="228" y1="205" x2="258" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar5)"/>

<rect x="262" y="150" width="185" height="110" rx="10" fill="#ccfbf1"/>
<text x="354" y="180" font-size="16" text-anchor="middle" font-weight="700" fill="#0f766e">2. Relative payoff</text>
<text x="354" y="206" font-size="14" text-anchor="middle" fill="#0f766e">easy scenes: same pay,</text>
<text x="354" y="228" font-size="14" text-anchor="middle" fill="#0f766e">much less effort</text>

<line x1="450" y1="205" x2="480" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar5)"/>

<rect x="484" y="150" width="185" height="110" rx="10" fill="#fef3c7"/>
<text x="576" y="180" font-size="16" text-anchor="middle" font-weight="700" fill="#92600a">3. Behavior shifts</text>
<text x="576" y="206" font-size="14" text-anchor="middle" fill="#92600a">common scenes 90 to 190</text>
<text x="576" y="228" font-size="14" text-anchor="middle" fill="#92600a">rare scenes stay 10</text>

<line x1="672" y1="205" x2="702" y2="205" stroke="#334155" stroke-width="2.5" marker-end="url(#ar5)"/>

<rect x="706" y="150" width="160" height="110" rx="10" fill="#fee2e2"/>
<text x="786" y="180" font-size="16" text-anchor="middle" font-weight="700" fill="#b91c1c">4. Goal drift</text>
<text x="786" y="206" font-size="14" text-anchor="middle" fill="#b91c1c">total +100 percent,</text>
<text x="786" y="228" font-size="14" text-anchor="middle" fill="#b91c1c">rare coverage +0</text>

<rect x="150" y="330" width="600" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="450" y="362" font-size="17" text-anchor="middle" font-weight="700">The metric went up. The goal did not move.</text>
<text x="450" y="392" font-size="15" text-anchor="middle" fill="#475569">People respond to relative payoffs, not to what you hoped they would do.</text>
<text x="450" y="414" font-size="15" text-anchor="middle" fill="#475569">Separate the true goal, the proxy metric, and the behavior it rewards.</text>
</g></svg>