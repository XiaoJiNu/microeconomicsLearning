<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">模型如地图：为回答问题而省略</title><desc id="d">现实包含收入天气心情等太多变量；模型只保留价格与数量关系Q等于120减10P，超出范围会失效。</desc>
<defs><filter id="wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="77" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/></filter></defs>
<rect width="960" height="600" fill="#fdf6e9"/>
<g font-family="'Segoe Print','Ma Shan Zheng','Xingkai SC','STXingkai','Kaiti SC','STKaiti','KaiTi','Noto Sans CJK SC',cursive" fill="#3b3734">
<rect x="40" y="51.76" width="297.76" height="17.6" fill="#ffe082" opacity="0.75" filter="url(#wob)"/>
<text x="48" y="62" font-size="32" fill="#3b3734" text-anchor="start" font-weight="700">模型是地图：有用，正因为省略</text>
<path d="M 42 72 q 138.88 8 293.76 0" fill="none" stroke="#3b3734" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<text x="480" y="112" font-size="20" fill="#3b3734" text-anchor="middle" font-weight="700">问题：咖啡店涨 1 元，每天少卖几杯？</text>
<rect x="46" y="140" width="330" height="300" rx="20" fill="#fadbd8" stroke="#c0392b" stroke-width="3.5" filter="url(#wob)"/>
<text x="211" y="178" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">现实（一团乱）</text>
<text x="211" y="224" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500" transform="rotate(1 211 224)">收入  天气  对手  心情</text>
<text x="211" y="264" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500" transform="rotate(-1 211 264)">排队  机器  豆子  房租</text>
<text x="211" y="304" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500" transform="rotate(1 211 304)">营销  季节  习惯  健康</text>
<text x="211" y="344" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500" transform="rotate(-1 211 344)">潮流动向  库存  汇率</text>
<text x="211" y="384" font-size="17" fill="#3b3734" text-anchor="middle" font-weight="500" transform="rotate(1 211 384)">…… 算不过来！</text>
<path d="M 410 200 L 500 260 L 410 320 Z" fill="#fcf3cf" stroke="#e67e22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<line x1="500" y1="260" x2="574" y2="260" stroke="#3b3734" stroke-width="4" stroke-linecap="round" filter="url(#wob)"/>
<path d="M 559.5 266.8 L 574 260 L 559.5 253.2" fill="none" stroke="#3b3734" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<text x="455" y="176" font-size="16" fill="#e67e22" text-anchor="middle" font-weight="700">只留回答</text>
<text x="455" y="356" font-size="16" fill="#e67e22" text-anchor="middle" font-weight="700">问题的变量</text>
<rect x="590" y="140" width="330" height="300" rx="20" fill="#d6eaf8" stroke="#2471a3" stroke-width="3.5" filter="url(#wob)"/>
<text x="755" y="178" font-size="23" fill="#2471a3" text-anchor="middle" font-weight="700">模型（故意很小）</text>
<text x="755" y="238" font-size="27" fill="#3b3734" text-anchor="middle" font-weight="700">Q = 120 − 10 × P</text>
<text x="622" y="292" font-size="17" fill="#3b3734" text-anchor="start" font-weight="500">P：每杯价格（输入）</text>
<text x="622" y="324" font-size="17" fill="#3b3734" text-anchor="start" font-weight="500">Q：每天计划杯数（输出）</text>
<text x="622" y="356" font-size="17" fill="#3b3734" text-anchor="start" font-weight="500">10：每涨 1 元，少卖 10 杯</text>
<text x="755" y="412" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="700">超出范围会失效：P = 20 → Q &lt; 0</text>
<rect x="48" y="522" width="864" height="58" rx="18" fill="#fff3c4" stroke="#3b3734" stroke-width="3.5" filter="url(#wob)"/>
<polygon points="78.0,538.0 81.4,546.3 90.4,547.0 83.6,552.8 85.6,561.5 78.0,556.9 70.4,561.5 72.4,552.8 65.6,547.0 74.6,546.3" fill="#e67e22" stroke="#3b3734" stroke-width="2" filter="url(#wob)"/>
<text x="104" y="559" font-size="19.5" fill="#3b3734" text-anchor="start" font-weight="700">画出每条裂缝的地图没有用——省略是特性，好坏由它要回答的问题决定。</text>
</g></svg>
