<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">模型如地图：为回答问题而省略</title>
<desc id="desc">左侧现实云里写着收入、天气、竞品价格、口味、心情、库存等许多因素；中间漏斗写着只保留回答问题所需的因素；右侧模型卡片写着需求关系Q等于120减10P和一条向下的小直线。</desc>
<defs><marker id="ar7" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#334155"/></marker></defs>
<rect width="900" height="520" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="26" font-weight="700">A model is a map: useful because it leaves things out</text>
<text x="40" y="78" font-size="16" fill="#475569">Question: how does one coffee shop price change affect planned purchases?</text>

<rect x="40" y="120" width="280" height="300" rx="14" fill="#e2e8f0"/>
<text x="190" y="152" font-size="18" text-anchor="middle" font-weight="700" fill="#334155">Reality (messy)</text>
<text x="70" y="196" font-size="15" fill="#475569">income, weather, rivals,</text>
<text x="70" y="222" font-size="15" fill="#475569">taste, mood, queue length,</text>
<text x="70" y="248" font-size="15" fill="#475569">machine capacity, beans,</text>
<text x="70" y="274" font-size="15" fill="#475569">rent, marketing, season,</text>
<text x="70" y="300" font-size="15" fill="#475569">habits, health, trends ...</text>
<text x="70" y="344" font-size="14" text-anchor="start" fill="#92600a">too much to compute</text>
<text x="70" y="368" font-size="14" fill="#92600a">directly</text>

<line x1="328" y1="270" x2="432" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#ar7)"/>
<text x="378" y="250" font-size="11" text-anchor="middle" fill="#334155">keep only what</text>
<text x="378" y="298" font-size="11" text-anchor="middle" fill="#334155">answers the question</text>

<rect x="440" y="120" width="420" height="300" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="650" y="152" font-size="18" text-anchor="middle" font-weight="700" fill="#0f766e">Model (small on purpose)</text>
<text x="650" y="200" font-size="22" text-anchor="middle" fill="#0f172a">Q = 120 - 10 P,  0 to 12</text>
<text x="650" y="232" font-size="14" text-anchor="middle" fill="#475569">P: price per cup (input, exogenous here)</text>
<text x="650" y="256" font-size="14" text-anchor="middle" fill="#475569">Q: planned cups per day (output)</text>
<text x="650" y="280" font-size="14" text-anchor="middle" fill="#475569">120: intercept;  10: cups lost per +1 price</text>
<line x1="490" y1="320" x2="810" y2="380" stroke="#2563eb" stroke-width="3"/>
<text x="500" y="310" font-size="13" fill="#2563eb">demand relation (teaching example)</text>
<text x="650" y="406" font-size="14" text-anchor="middle" fill="#b91c1c">fails outside its range: P = 20 gives negative Q</text>

<text x="40" y="482" font-size="15" fill="#475569">A map that showed every crack would be useless. Same for models: omission is a feature, judged by the question.</text>
</g></svg>