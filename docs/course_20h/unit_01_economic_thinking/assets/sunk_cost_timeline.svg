<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">沉没成本：现在的选择还能改变什么</title><desc id="d">已付3000元中2000收不回属沉没成本；决策只比较继续与退出两条未来的差值。</desc>
<defs><filter id="wob" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="640"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/></filter></defs>
<rect width="960" height="600" fill="#fdf6e9"/>
<g font-family="'Segoe Print','Ma Shan Zheng','Xingkai SC','STXingkai','Kaiti SC','STKaiti','KaiTi','Noto Sans CJK SC',cursive" fill="#3b3734">
<rect x="40" y="51.76" width="496.15999999999997" height="17.6" fill="#ffe082" opacity="0.75" filter="url(#wob)"/>
<text x="48" y="62" font-size="32" fill="#3b3734" text-anchor="start" font-weight="700">沉没成本 Sunk Cost：现在还能改变什么？</text>
<path d="M 42 72 q 238.07999999999998 8 492.15999999999997 0" fill="none" stroke="#3b3734" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<rect x="60" y="120" width="330" height="150" rx="18" fill="#e9e7e4" stroke="#7f8c8d" stroke-width="3.5" filter="url(#wob)"/>
<text x="84" y="156" font-size="21" fill="#3b3734" text-anchor="start" font-weight="700">过去：已付 3000 元</text>
<text x="84" y="194" font-size="19" fill="#c0392b" text-anchor="start" font-weight="700">2000 收不回 → 沉没</text>
<line x1="78" y1="200" x2="330" y2="186" stroke="#c0392b" stroke-width="3" stroke-linecap="round" filter="url(#wob)"/>
<text x="84" y="232" font-size="19" fill="#1e8449" text-anchor="start" font-weight="700">1000 可退 → 还作数</text>
<line x1="395" y1="195" x2="478" y2="195" stroke="#3b3734" stroke-width="4" stroke-linecap="round" filter="url(#wob)"/>
<path d="M 463.5 201.8 L 478 195 L 463.5 188.2" fill="none" stroke="#3b3734" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<circle cx="500" cy="195" r="10" fill="#3b3734" stroke="#3b3734" stroke-width="3" filter="url(#wob)"/>
<text x="500" y="160" font-size="22" fill="#3b3734" text-anchor="middle" font-weight="700">现在</text>
<text x="500" y="240" font-size="18" fill="#7f8c8d" text-anchor="middle" font-weight="500">继续 or 退出？</text>
<line x1="512" y1="180" x2="588" y2="152" stroke="#2471a3" stroke-width="3.5" stroke-linecap="round" filter="url(#wob)"/>
<path d="M 576.7 163.4 L 588 152 L 572.1 150.7" fill="none" stroke="#2471a3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<line x1="512" y1="210" x2="588" y2="288" stroke="#1e8449" stroke-width="3.5" stroke-linecap="round" filter="url(#wob)"/>
<path d="M 573.0 282.3 L 588 288 L 582.7 272.9" fill="none" stroke="#1e8449" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
<rect x="600" y="108" width="310" height="92" rx="16" fill="#d6eaf8" stroke="#2471a3" stroke-width="3.5" filter="url(#wob)"/>
<text x="622" y="140" font-size="20" fill="#2471a3" text-anchor="start" font-weight="700">继续学：</text>
<text x="622" y="172" font-size="18" fill="#3b3734" text-anchor="start" font-weight="500">+1800 −1000 −600 = +200</text>
<rect x="600" y="246" width="310" height="92" rx="16" fill="#d5f5e3" stroke="#1e8449" stroke-width="3.5" filter="url(#wob)"/>
<text x="622" y="278" font-size="20" fill="#1e8449" text-anchor="start" font-weight="700">退出：</text>
<text x="622" y="310" font-size="18" fill="#3b3734" text-anchor="start" font-weight="500">+1000 退款 +600 兼职 = 1600</text>
<text x="80" y="396" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700">注意：收不回的 2000，</text>
<text x="80" y="428" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700">在“继续”和“退出”两本账里都不出现</text>
<rect x="60" y="380" width="460" height="66" rx="14" fill="none" stroke="#c0392b" stroke-width="3" filter="url(#wob)"/>
<text x="560" y="420" font-size="20" fill="#3b3734" text-anchor="start" font-weight="700">它比的是未来的差距</text>
<rect x="48" y="522" width="864" height="58" rx="18" fill="#fff3c4" stroke="#3b3734" stroke-width="3.5" filter="url(#wob)"/>
<polygon points="78.0,538.0 81.4,546.3 90.4,547.0 83.6,552.8 85.6,561.5 78.0,556.9 70.4,561.5 72.4,552.8 65.6,547.0 74.6,546.3" fill="#e67e22" stroke="#3b3734" stroke-width="2" filter="url(#wob)"/>
<text x="104" y="559" font-size="19.5" fill="#3b3734" text-anchor="start" font-weight="700">能不能被现在的选择改变？不能，就放下——只看两条未来的差。</text>
</g></svg>
