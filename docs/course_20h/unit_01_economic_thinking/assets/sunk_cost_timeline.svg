<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">沉没成本：现在的选择还能改变什么</title>
<desc id="desc">时间线分三段。过去：已付3000元，其中2000元不可退，是沉没成本；1000元可退，仍受当前选择影响。现在是决策点。未来：继续得到1800学习价值但放弃退款1000和替代收入600；退出得到退款1000和替代收入600。</desc>
<defs><marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#334155"/></marker></defs>
<rect width="900" height="520" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="40" y="48" font-size="26" font-weight="700">Sunk cost: what can your choice still change?</text>
<text x="40" y="78" font-size="16" fill="#475569">Course example: 3000 already paid, 1000 refundable if you quit now.</text>

<line x1="60" y1="260" x2="850" y2="260" stroke="#334155" stroke-width="2.5" marker-end="url(#ar3)"/>
<text x="850" y="292" font-size="15" fill="#475569" text-anchor="end">time</text>

<rect x="80" y="140" width="270" height="90" rx="10" fill="#e2e8f0"/>
<text x="215" y="168" font-size="17" text-anchor="middle" font-weight="700">PAST — already paid 3000</text>
<text x="215" y="194" font-size="15" text-anchor="middle" fill="#b91c1c">2000 unrecoverable = sunk</text>
<text x="215" y="216" font-size="15" text-anchor="middle" fill="#0f766e">1000 refundable = still relevant</text>

<circle cx="450" cy="260" r="10" fill="#d89a20"/>
<text x="450" y="118" font-size="18" text-anchor="middle" font-weight="700" fill="#d89a20">NOW: continue or quit?</text>
<line x1="450" y1="128" x2="450" y2="246" stroke="#d89a20" stroke-width="2" stroke-dasharray="5 5"/>

<rect x="560" y="110" width="300" height="80" rx="10" fill="#dbeafe"/>
<text x="710" y="136" font-size="16" text-anchor="middle" font-weight="700" fill="#1d4ed8">CONTINUE: +1800 learning value</text>
<text x="710" y="160" font-size="14" text-anchor="middle" fill="#1d4ed8">give up 1000 refund + 600 alt. work</text>
<text x="710" y="181" font-size="14" text-anchor="middle" fill="#1d4ed8">net +200 vs quit</text>

<rect x="560" y="330" width="300" height="80" rx="10" fill="#dcfce7"/>
<text x="710" y="356" font-size="16" text-anchor="middle" font-weight="700" fill="#166534">QUIT: +1000 refund</text>
<text x="710" y="380" font-size="14" text-anchor="middle" fill="#166534">+600 alternative work</text>
<text x="710" y="401" font-size="14" text-anchor="middle" fill="#166534">total 1600</text>

<text x="40" y="482" font-size="15" fill="#475569">Only the gap between futures decides: 1800 - 1000 - 600 = 200. The unrecoverable 2000 appears on neither side.</text>
</g></svg>