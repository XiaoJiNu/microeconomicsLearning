<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">上大学的机会成本</title>
  <desc id="d">对比两种算法：把学费住宿伙食加总的常见算法有两个问题；真正的机会成本要扣除并非多出的食宿费，并加上被忽略的最大一项——放弃的工作收入。</desc>

  <rect width="900" height="560" rx="18" fill="#fdfcf8"/>
  <rect x="1" y="1" width="898" height="558" rx="17" fill="none" stroke="#e7e2d6" stroke-width="2"/>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">

    <text x="450" y="52" text-anchor="middle" font-size="15" fill="#b45309" letter-spacing="4">原理二 · 某种东西的成本是为了得到它所放弃的东西</text>
    <text x="450" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2937">上一年大学，真正花了你什么？</text>

    <!-- ===== 左卡：常见算法 ===== -->
    <rect x="50" y="116" width="380" height="250" rx="14" fill="#ffffff" stroke="#e7e2d6" stroke-width="1.5"/>
    <rect x="74" y="138" width="150" height="34" rx="17" fill="#fee2e2"/>
    <text x="149" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">直觉的算法 ✗</text>

    <g font-size="14.5" fill="#374151">
      <text x="86" y="202">学费 ＋ 书籍</text>
      <text x="86" y="232">＋ 住宿 ＋ 伙食</text>
      <text x="86" y="262" font-weight="700" fill="#b91c1c">＝ “上一年的全部成本”</text>
    </g>

    <rect x="74" y="286" width="332" height="62" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="90" y="310" font-size="13.5" fill="#b91c1c">问题① 住宿和伙食：离开学校你也要吃住</text>
    <text x="90" y="333" font-size="13.5" fill="#b91c1c">问题② 漏掉了最大的成本——你的时间</text>

    <!-- 中间箭头 -->
    <path d="M 444 241 L 470 241" stroke="#b45309" stroke-width="2.5" fill="none"/>
    <path d="M 470 241 L 460 234 M 470 241 L 460 248" stroke="#b45309" stroke-width="2.5" fill="none"/>

    <!-- ===== 右卡：机会成本算法 ===== -->
    <rect x="486" y="116" width="364" height="250" rx="14" fill="#ffffff" stroke="#e7e2d6" stroke-width="1.5"/>
    <rect x="510" y="138" width="170" height="34" rx="17" fill="#d1fae5"/>
    <text x="595" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">经济学家的算法 ✓</text>

    <!-- 堆叠条：宽度大致按比例，放弃的收入最大 -->
    <rect x="510" y="196" width="96" height="44" rx="8" fill="#93c5fd"/>
    <text x="558" y="223" text-anchor="middle" font-size="13" fill="#1e3a8a">学费＋书籍</text>
    <rect x="606" y="196" width="76" height="44" rx="8" fill="#fcd34d"/>
    <text x="644" y="216" text-anchor="middle" font-size="12" fill="#78350f">食宿贵出</text>
    <text x="644" y="232" text-anchor="middle" font-size="12" fill="#78350f">的部分</text>
    <rect x="682" y="196" width="148" height="44" rx="8" fill="#f87171"/>
    <text x="756" y="216" text-anchor="middle" font-size="12.5" fill="#ffffff">放弃的一年工资</text>
    <text x="756" y="232" text-anchor="middle" font-size="12.5" fill="#ffffff">（最大单项成本）</text>

    <text x="510" y="272" font-size="13.5" fill="#6b7280">当你把一年用于听课、读书和写论文，这一年就不</text>
    <text x="510" y="294" font-size="13.5" fill="#6b7280">能用来工作。<tspan font-weight="700" fill="#b91c1c">为上学放弃的收入</tspan>是大多数学生接</text>
    <text x="510" y="316" font-size="13.5" fill="#6b7280">受教育的最大单项成本。</text>
    <text x="510" y="346" font-size="13.5" fill="#047857">决策时，要看到每一种行动“放弃了什么”。</text>

    <!-- ===== 底部例子条：大学运动员 ===== -->
    <rect x="50" y="392" width="800" height="86" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="74" y="424" font-size="15" font-weight="700" fill="#92400e">教材里的对照例子</text>
    <text x="74" y="450" font-size="14.5" fill="#78350f">能进职业队的大学运动员，退学打球每年可赚几百万美元 —— 他们上大学的机会成本极高，</text>
    <text x="74" y="472" font-size="14.5" fill="#78350f">所以常常认为不值得。他们并不是“不算账”，而是算清了这笔被忽略的账。</text>

    <!-- 定义条 -->
    <rect x="50" y="498" width="800" height="42" rx="21" fill="#1f2937"/>
    <text x="450" y="525" text-anchor="middle" font-size="15.5" fill="#fef3c7">机会成本（Opportunity Cost）＝ 为了得到某种东西所必须放弃的东西</text>
  </g>
</svg>
