<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc">
<title id="title">图 5-8 世界石油市场供给减少</title>
<desc id="desc">（a）短期石油市场供求均缺乏弹性（陡峭），供给从 S1 左移到 S2 引起价格从 P1 到 P2 大幅度上升；（b）长期石油市场供求均富有弹性（平坦），供给同样大小的水平左移仅引起价格小幅度上升。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .s1{fill:none;stroke:#b33a3a;stroke-width:2.8}
  .s2{fill:none;stroke:#c75b12;stroke-width:3;stroke-dasharray:6 4}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:13px;font-weight:600}
  .sub{font-size:16.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 5-8 世界石油市场供给减少</text>

<!-- Panel (a): Short Run (Steep D & S, horizontal shift dx = -70px) -->
<g transform="translate(20,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（a）短期石油市场</text>
  <line x1="80" y1="50" x2="80" y2="345" class="axis"/>
  <line x1="80" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Steep D: y = 2.4*(x - 280) + 225. Steep S1: y = -2.4*(x - 280) + 225.
       S2 shifted left by 70px: y = -2.4*(x - 210) + 225 => intersection at x=245, y=141!
       P1 at y=225, P2 at y=141 (delta P = 84px!) -->
  <line x1="80" y1="225" x2="280" y2="225" class="dash"/>
  <line x1="80" y1="141" x2="245" y2="141" class="dash"/>

  <line x1="212" y1="62" x2="325" y2="333" class="demand"/>
  <line x1="235" y1="333" x2="348" y2="62" class="s1"/>
  <line x1="165" y1="333" x2="278" y2="62" class="s2"/>

  <circle cx="280" cy="225" r="4.5" fill="#17202a"/>
  <circle cx="245" cy="141" r="4.5" fill="#c75b12"/>

  <text x="68" y="350" font-size="13" text-anchor="end">0</text>
  <text x="68" y="230" font-size="13.5" font-weight="600" text-anchor="end">P₁</text>
  <text x="68" y="146" font-size="13.5" font-weight="600" text-anchor="end">P₂</text>
  <text x="275" y="384" font-size="14.5" text-anchor="middle">石油产量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">石油价格</text>

  <text x="354" y="68" font-size="14.5" font-weight="600" style="fill:#b33a3a">S₁</text>
  <text x="256" y="58" font-size="14.5" font-weight="600" style="fill:#c75b12">S₂</text>
  <text x="332" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>

  <line x1="322" y1="108" x2="262" y2="108" stroke="#16805b" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="330" y="104" class="note">1. 短期中供求缺乏弹性，</text>
  <text x="330" y="122" class="note">供给左移……</text>
  <line x1="104" y1="220" x2="104" y2="148" stroke="#16805b" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="114" y="188" class="note">2. ……引起价格大幅上升</text>
</g>

<!-- Panel (b): Long Run (Flat D & S, EXACT same horizontal shift dx = -70px) -->
<g transform="translate(550,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（b）长期石油市场</text>
  <line x1="80" y1="50" x2="80" y2="345" class="axis"/>
  <line x1="80" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Flat D: y = 0.36*(x - 280) + 225. Flat S1: y = -0.36*(x - 280) + 225.
       S2 shifted left by SAME 70px: y = -0.36*(x - 210) + 225 => intersection at x=245, y=212.4!
       P1 at y=225, P2 at y=212.4 (delta P = only 12.6px!) -->
  <line x1="80" y1="225" x2="280" y2="225" class="dash"/>
  <line x1="80" y1="212" x2="245" y2="212" class="dash"/>

  <line x1="115" y1="166" x2="445" y2="284" class="demand"/>
  <line x1="145" y1="274" x2="445" y2="166" class="s1"/>
  <line x1="105" y1="263" x2="375" y2="166" class="s2"/>

  <circle cx="280" cy="225" r="4.5" fill="#17202a"/>
  <circle cx="245" cy="212" r="4.5" fill="#c75b12"/>

  <text x="68" y="350" font-size="13" text-anchor="end">0</text>
  <text x="68" y="232" font-size="13.5" font-weight="600" text-anchor="end">P₁</text>
  <text x="68" y="211" font-size="13.5" font-weight="600" text-anchor="end">P₂</text>
  <text x="275" y="384" font-size="14.5" text-anchor="middle">石油产量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">石油价格</text>

  <text x="450" y="170" font-size="14.5" font-weight="600" style="fill:#b33a3a">S₁</text>
  <text x="368" y="158" font-size="14.5" font-weight="600" style="fill:#c75b12">S₂</text>
  <text x="448" y="290" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>

  <line x1="395" y1="184" x2="333" y2="184" stroke="#16805b" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="240" y="104" class="note">1. 长期中供求富有弹性，供给同样大小左移……</text>
  <text x="114" y="196" class="note">2. ……仅引起价格小幅上升</text>
</g>
</svg>
