<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
<title id="title">图 5-9 减少非法毒品使用的政策</title>
<desc id="desc">（a）禁毒使供给从 S1 左移到 S2，在缺乏弹性的毒品需求下，数量从 Q1 略减为 Q2，价格从 P1 大幅升至 P2，吸毒者总货币支出增加；（b）禁毒教育使需求从 D1 左移到 D2，价格从 P1 降至 P2、数量从 Q1 减至 Q2，总货币支出减少。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .d2{fill:none;stroke:#2457a6;stroke-width:3;stroke-dasharray:6 4}
  .supply{fill:none;stroke:#b33a3a;stroke-width:2.8}
  .s2{fill:none;stroke:#c75b12;stroke-width:3;stroke-dasharray:6 4}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:13px;font-weight:600}
  .sub{font-size:16.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-dr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 5-9 减少非法毒品使用的政策</text>

<!-- Panel (a): Drug Interdiction -->
<g transform="translate(20,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（a）禁毒</text>
  <line x1="80" y1="50" x2="80" y2="345" class="axis"/>
  <line x1="80" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Steep D: passes through (275, 235) [Q1, P1] and (248, 145) [Q2, P2] -->
  <line x1="80" y1="235" x2="275" y2="235" class="dash"/>
  <line x1="275" y1="235" x2="275" y2="345" class="dash"/>
  <line x1="80" y1="145" x2="248" y2="145" class="dash"/>
  <line x1="248" y1="145" x2="248" y2="345" class="dash"/>

  <line x1="224" y1="65" x2="305" y2="335" class="demand"/>
  <line x1="165" y1="323" x2="425" y2="115" class="supply"/>
  <line x1="128" y1="241" x2="358" y2="57" class="s2"/>

  <circle cx="275" cy="235" r="4.5" fill="#17202a"/>
  <circle cx="248" cy="145" r="4.5" fill="#c75b12"/>

  <text x="68" y="350" font-size="13" text-anchor="end">0</text>
  <text x="68" y="240" font-size="13.5" font-weight="600" text-anchor="end">P₁</text>
  <text x="68" y="150" font-size="13.5" font-weight="600" text-anchor="end">P₂</text>
  <text x="243" y="366" font-size="13" font-weight="600" text-anchor="middle">Q₂</text>
  <text x="279" y="366" font-size="13" font-weight="600" text-anchor="middle">Q₁</text>
  <text x="275" y="394" font-size="14.5" text-anchor="middle">毒品数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">毒品价格</text>

  <text x="430" y="118" font-size="14.5" font-weight="600" style="fill:#b33a3a">S₁</text>
  <text x="364" y="62" font-size="14.5" font-weight="600" style="fill:#c75b12">S₂</text>
  <text x="312" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>

  <line x1="365" y1="158" x2="312" y2="115" stroke="#16805b" stroke-width="2" marker-end="url(#arr-dr)"/>
  <text x="336" y="176" class="note">1. 禁毒减少毒品供给……</text>
  <line x1="102" y1="229" x2="102" y2="152" stroke="#16805b" stroke-width="2" marker-end="url(#arr-dr)"/>
  <text x="112" y="196" class="note">2. ……大幅提高了价格……</text>
  <text x="245" y="416" class="note" text-anchor="middle">3. ……销售量只略微减少（需求缺乏弹性 ⇒ 总支出增加）</text>
</g>

<!-- Panel (b): Drug Education -->
<g transform="translate(550,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（b）禁毒教育</text>
  <line x1="80" y1="50" x2="80" y2="345" class="axis"/>
  <line x1="80" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Supply passes through (295, 175) [Q1, P1] and (215, 239) [Q2, P2] -->
  <line x1="80" y1="175" x2="295" y2="175" class="dash"/>
  <line x1="295" y1="175" x2="295" y2="345" class="dash"/>
  <line x1="80" y1="239" x2="215" y2="239" class="dash"/>
  <line x1="215" y1="239" x2="215" y2="345" class="dash"/>

  <line x1="135" y1="303" x2="425" y2="71" class="supply"/>
  <line x1="255" y1="65" x2="352" y2="332" class="demand"/>
  <line x1="152" y1="65" x2="249" y2="332" class="d2"/>

  <circle cx="295" cy="175" r="4.5" fill="#17202a"/>
  <circle cx="215" cy="239" r="4.5" fill="#2457a6"/>

  <text x="68" y="350" font-size="13" text-anchor="end">0</text>
  <text x="68" y="180" font-size="13.5" font-weight="600" text-anchor="end">P₁</text>
  <text x="68" y="244" font-size="13.5" font-weight="600" text-anchor="end">P₂</text>
  <text x="215" y="366" font-size="13" font-weight="600" text-anchor="middle">Q₂</text>
  <text x="295" y="366" font-size="13" font-weight="600" text-anchor="middle">Q₁</text>
  <text x="275" y="394" font-size="14.5" text-anchor="middle">毒品数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">毒品价格</text>

  <text x="430" y="75" font-size="14.5" font-weight="600" style="fill:#b33a3a">供给</text>
  <text x="358" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">D₁</text>
  <text x="255" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">D₂</text>

  <line x1="268" y1="112" x2="186" y2="112" stroke="#16805b" stroke-width="2" marker-end="url(#arr-dr)"/>
  <text x="276" y="116" class="note">1. 禁毒教育减少毒品需求……</text>
  <line x1="102" y1="181" x2="102" y2="232" stroke="#16805b" stroke-width="2" marker-end="url(#arr-dr)"/>
  <text x="112" y="212" class="note">2. ……降低了价格……</text>
  <line x1="289" y1="326" x2="223" y2="326" stroke="#16805b" stroke-width="2" marker-end="url(#arr-dr)"/>
  <text x="245" y="416" class="note" text-anchor="middle">3. ……并减少了销售量（价跌量减 ⇒ 总支出减少）</text>
</g>
</svg>
