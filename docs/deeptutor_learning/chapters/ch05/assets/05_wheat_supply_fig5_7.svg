<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
<title id="title">图 5-7 小麦市场上供给增加</title>
<desc id="desc">农业技术进步使小麦供给曲线从 S1 右移到 S2。由于小麦需求缺乏弹性，价格从 3 美元大幅降至 2 美元，而销量仅从 100 蒲式耳增至 110 蒲式耳，农民总收益从 300 美元减为 220 美元。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .s1{fill:none;stroke:#b33a3a;stroke-width:2.8}
  .s2{fill:none;stroke:#c75b12;stroke-width:3;stroke-dasharray:6 4}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:13.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="390" y="36" font-size="22" text-anchor="middle" font-weight="600">图 5-7 小麦市场上供给增加</text>

<line x1="110" y1="68" x2="110" y2="375" class="axis"/>
<line x1="110" y1="375" x2="660" y2="375" class="axis"/>

<!-- Steep Demand passing through (360, 175) [$3, 100] and (392, 265) [$2, 110] -->
<line x1="110" y1="175" x2="360" y2="175" class="dash"/>
<line x1="360" y1="175" x2="360" y2="375" class="dash"/>
<line x1="110" y1="265" x2="392" y2="265" class="dash"/>
<line x1="392" y1="265" x2="392" y2="375" class="dash"/>

<line x1="326" y1="80" x2="426" y2="360" class="demand"/>
<!-- S1 passes through (360, 175): from (210, 325) to (455, 80) -->
<line x1="210" y1="325" x2="455" y2="80" class="s1"/>
<!-- S2 shifted right by 122px: passes through (392, 265): from (332, 325) to (577, 80) -->
<line x1="332" y1="325" x2="577" y2="80" class="s2"/>

<circle cx="360" cy="175" r="5" fill="#17202a"/>
<circle cx="392" cy="265" r="5" fill="#c75b12"/>

<text x="98" y="380" font-size="13" text-anchor="end">0</text>
<text x="98" y="270" font-size="14" font-weight="600" text-anchor="end">$2</text>
<text x="98" y="180" font-size="14" font-weight="600" text-anchor="end">$3</text>
<text x="352" y="398" font-size="13.5" font-weight="600" text-anchor="middle">100</text>
<text x="398" y="398" font-size="13.5" font-weight="600" text-anchor="middle">110</text>

<text x="390" y="432" font-size="15" text-anchor="middle">小麦数量（蒲式耳）</text>
<text x="42" y="225" font-size="15" text-anchor="middle" transform="rotate(-90 42 225)">小麦的价格</text>

<text x="462" y="84" font-size="15" font-weight="600" style="fill:#b33a3a">S₁</text>
<text x="584" y="84" font-size="15" font-weight="600" style="fill:#c75b12">S₂</text>
<text x="434" y="356" font-size="15" font-weight="600" style="fill:#2457a6">需求</text>

<!-- Step callouts matching Mankiw Fig 5-7 -->
<line x1="428" y1="115" x2="536" y2="115" stroke="#16805b" stroke-width="2.2" marker-end="url(#arr-w)"/>
<text x="546" y="112" class="note">1. 当需求缺乏弹性时，</text>
<text x="546" y="131" class="note">小麦供给增加……</text>

<line x1="136" y1="183" x2="136" y2="257" stroke="#16805b" stroke-width="2.2" marker-end="url(#arr-w)"/>
<text x="148" y="224" class="note">2. ……引起价格大幅度下降……</text>

<line x1="362" y1="355" x2="388" y2="355" stroke="#16805b" stroke-width="2.2" marker-end="url(#arr-w)"/>
<text x="465" y="280" class="note">3. ……而销售量只略微增加</text>
<text x="465" y="302" font-size="13" font-weight="600" style="fill:#991b1b">（总收益：$300 → $220）</text>
</svg>
