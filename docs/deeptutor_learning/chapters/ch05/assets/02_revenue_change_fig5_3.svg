<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
<title id="title">图 5-3 当价格变动时，总收益如何变动</title>
<desc id="desc">（a）需求缺乏弹性时，价格从 4 美元升至 5 美元，需求量从 100 减为 90，额外收益面积 A（90美元）大于减少收益面积 B（40美元），总收益从 400 美元增至 450 美元；（b）需求富有弹性时，价格从 4 美元升至 5 美元，需求量从 100 减为 70，面积 A（70美元）小于面积 B（120美元），总收益从 400 美元减为 350 美元。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .curve{fill:none;stroke:#2457a6;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.3;stroke-dasharray:5 4}
  .sub{font-size:16.5px;font-weight:600}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 5-3 当价格变动时，总收益如何变动</text>

<!-- Panel (a): Inelastic Demand -->
<g transform="translate(20,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（a）需求缺乏弹性的情况</text>
  <!-- Common box ($4 x 90) -->
  <rect x="75" y="185" width="216" height="160" fill="#eef2f6"/>
  <!-- Gain A: ($5-$4) x 90 -->
  <rect x="75" y="145" width="216" height="40" fill="#d1fae5"/>
  <!-- Loss B: $4 x (100-90) -->
  <rect x="291" y="185" width="24" height="160" fill="#fee2e2"/>

  <line x1="75" y1="50" x2="75" y2="345" class="axis"/>
  <line x1="75" y1="345" x2="465" y2="345" class="axis"/>
  <line x1="75" y1="145" x2="291" y2="145" class="dash"/>
  <line x1="291" y1="145" x2="291" y2="345" class="dash"/>
  <line x1="75" y1="185" x2="315" y2="185" class="dash"/>
  <line x1="315" y1="185" x2="315" y2="345" class="dash"/>

  <line x1="243" y1="65" x2="399" y2="325" class="curve"/>
  <circle cx="291" cy="145" r="4.5" fill="#2457a6"/>
  <circle cx="315" cy="185" r="4.5" fill="#2457a6"/>

  <text x="64" y="350" font-size="13" text-anchor="end">0</text>
  <text x="64" y="190" font-size="13.5" font-weight="600" text-anchor="end">$4</text>
  <text x="64" y="150" font-size="13.5" font-weight="600" text-anchor="end">$5</text>
  <text x="285" y="366" font-size="13" font-weight="600" text-anchor="middle">90</text>
  <text x="321" y="366" font-size="13" font-weight="600" text-anchor="middle">100</text>
  <text x="270" y="394" font-size="14.5" text-anchor="middle">数量</text>
  <text x="20" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 20 200)">价格</text>

  <text x="183" y="171" font-size="16" font-weight="700" text-anchor="middle" style="fill:#065f46">A（+$90）</text>
  <text x="303" y="268" font-size="14" font-weight="700" text-anchor="middle" style="fill:#991b1b">B</text>
  <text x="358" y="270" font-size="12.5" style="fill:#991b1b">← 减少 $40</text>
  <text x="405" y="316" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
  <text x="245" y="416" font-size="13.5" text-anchor="middle" font-weight="600" style="fill:#065f46">额外收益 A &gt; 减少收益 B ⇒ 总收益：$400 → $450</text>
</g>

<!-- Panel (b): Elastic Demand -->
<g transform="translate(550,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（b）需求富有弹性的情况</text>
  <!-- Common box ($4 x 70) -->
  <rect x="75" y="185" width="168" height="160" fill="#eef2f6"/>
  <!-- Gain A: ($5-$4) x 70 -->
  <rect x="75" y="145" width="168" height="40" fill="#d1fae5"/>
  <!-- Loss B: $4 x (100-70) -->
  <rect x="243" y="185" width="72" height="160" fill="#fee2e2"/>

  <line x1="75" y1="50" x2="75" y2="345" class="axis"/>
  <line x1="75" y1="345" x2="465" y2="345" class="axis"/>
  <line x1="75" y1="145" x2="243" y2="145" class="dash"/>
  <line x1="243" y1="145" x2="243" y2="345" class="dash"/>
  <line x1="75" y1="185" x2="315" y2="185" class="dash"/>
  <line x1="315" y1="185" x2="315" y2="345" class="dash"/>

  <line x1="135" y1="85" x2="441" y2="255" class="curve"/>
  <circle cx="243" cy="145" r="4.5" fill="#2457a6"/>
  <circle cx="315" cy="185" r="4.5" fill="#2457a6"/>

  <text x="64" y="350" font-size="13" text-anchor="end">0</text>
  <text x="64" y="190" font-size="13.5" font-weight="600" text-anchor="end">$4</text>
  <text x="64" y="150" font-size="13.5" font-weight="600" text-anchor="end">$5</text>
  <text x="243" y="366" font-size="13" font-weight="600" text-anchor="middle">70</text>
  <text x="315" y="366" font-size="13" font-weight="600" text-anchor="middle">100</text>
  <text x="270" y="394" font-size="14.5" text-anchor="middle">数量</text>
  <text x="20" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 20 200)">价格</text>

  <text x="159" y="171" font-size="16" font-weight="700" text-anchor="middle" style="fill:#065f46">A（+$70）</text>
  <text x="279" y="268" font-size="15.5" font-weight="700" text-anchor="middle" style="fill:#991b1b">B（-$120）</text>
  <text x="430" y="242" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
  <text x="245" y="416" font-size="13.5" text-anchor="middle" font-weight="600" style="fill:#991b1b">额外收益 A &lt; 减少收益 B ⇒ 总收益：$400 → $350</text>
</g>
</svg>
