<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">图 5-1 需求价格弹性</title>
<desc id="desc">五幅子图展示按中点法计算的需求价格弹性：（a）完全无弹性（弹性=0，垂直线，数量恒为100）；（b）缺乏弹性（弹性小于1，价格4升至5上升22%，需求量100减至90下降11%）；（c）单位弹性（弹性等于1，价格上升22%，需求量100减至80下降22%）；（d）富有弹性（弹性大于1，价格上升22%，需求量100减至50下降67%）；（e）完全有弹性（弹性无穷大，在4美元处水平）。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .curve{fill:none;stroke:#2457a6;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:12.5px;font-weight:600}
  .sub{font-size:15px;font-weight:600}
</style>
<defs>
  <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="540" y="34" font-size="22" text-anchor="middle" font-weight="600">图 5-1 需求价格弹性（所有变动百分比均用中点法计算）</text>

<!-- (a) Perfectly Inelastic -->
<g transform="translate(30,62)">
  <text x="165" y="18" class="sub" text-anchor="middle">（a）完全无弹性的需求：弹性等于 0</text>
  <line x1="58" y1="36" x2="58" y2="210" class="axis"/>
  <line x1="58" y1="210" x2="300" y2="210" class="axis"/>
  <text x="48" y="214" font-size="12.5" text-anchor="end">0</text>
  <text x="48" y="138" font-size="12.5" text-anchor="end">$4</text>
  <text x="48" y="92" font-size="12.5" text-anchor="end">$5</text>
  <text x="175" y="229" font-size="12.5" text-anchor="middle">100</text>
  <text x="285" y="232" font-size="13" text-anchor="end">数量</text>
  <text x="16" y="125" font-size="13" text-anchor="middle" transform="rotate(-90 16 125)">价格</text>
  <line x1="58" y1="134" x2="175" y2="134" class="dash"/>
  <line x1="58" y1="88" x2="175" y2="88" class="dash"/>
  <line x1="175" y1="45" x2="175" y2="210" class="curve"/>
  <text x="184" y="60" font-size="14" font-weight="600" style="fill:#2457a6">需求</text>
  <line x1="78" y1="130" x2="78" y2="95" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="86" y="116" class="note">1. 价格上升……</text>
  <text x="165" y="252" class="note" text-anchor="middle">2. ……使需求量不变</text>
</g>

<!-- (b) Inelastic -->
<g transform="translate(375,62)">
  <text x="165" y="18" class="sub" text-anchor="middle">（b）缺乏弹性的需求：弹性小于 1</text>
  <line x1="58" y1="36" x2="58" y2="210" class="axis"/>
  <line x1="58" y1="210" x2="300" y2="210" class="axis"/>
  <text x="48" y="214" font-size="12.5" text-anchor="end">0</text>
  <text x="48" y="138" font-size="12.5" text-anchor="end">$4</text>
  <text x="48" y="92" font-size="12.5" text-anchor="end">$5</text>
  <text x="158" y="229" font-size="12.5" text-anchor="middle">90</text>
  <text x="188" y="229" font-size="12.5" text-anchor="middle">100</text>
  <text x="285" y="232" font-size="13" text-anchor="end">数量</text>
  <text x="16" y="125" font-size="13" text-anchor="middle" transform="rotate(-90 16 125)">价格</text>
  <line x1="58" y1="88" x2="158" y2="88" class="dash"/>
  <line x1="158" y1="88" x2="158" y2="210" class="dash"/>
  <line x1="58" y1="134" x2="188" y2="134" class="dash"/>
  <line x1="188" y1="134" x2="188" y2="210" class="dash"/>
  <line x1="130" y1="45" x2="232" y2="201" class="curve"/>
  <circle cx="158" cy="88" r="4" fill="#2457a6"/>
  <circle cx="188" cy="134" r="4" fill="#2457a6"/>
  <text x="238" y="196" font-size="14" font-weight="600" style="fill:#2457a6">需求</text>
  <line x1="74" y1="130" x2="74" y2="95" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="82" y="116" class="note">1. 价格上升 22%……</text>
  <line x1="185" y1="196" x2="162" y2="196" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="172" y="252" class="note" text-anchor="middle">2. ……使需求量减少 11%</text>
</g>

<!-- (c) Unit Elastic -->
<g transform="translate(720,62)">
  <text x="165" y="18" class="sub" text-anchor="middle">（c）单位弹性的需求：弹性等于 1</text>
  <line x1="58" y1="36" x2="58" y2="210" class="axis"/>
  <line x1="58" y1="210" x2="300" y2="210" class="axis"/>
  <text x="48" y="214" font-size="12.5" text-anchor="end">0</text>
  <text x="48" y="138" font-size="12.5" text-anchor="end">$4</text>
  <text x="48" y="92" font-size="12.5" text-anchor="end">$5</text>
  <text x="148" y="229" font-size="12.5" text-anchor="middle">80</text>
  <text x="192" y="229" font-size="12.5" text-anchor="middle">100</text>
  <text x="285" y="232" font-size="13" text-anchor="end">数量</text>
  <text x="16" y="125" font-size="13" text-anchor="middle" transform="rotate(-90 16 125)">价格</text>
  <line x1="58" y1="88" x2="148" y2="88" class="dash"/>
  <line x1="148" y1="88" x2="148" y2="210" class="dash"/>
  <line x1="58" y1="134" x2="192" y2="134" class="dash"/>
  <line x1="192" y1="134" x2="192" y2="210" class="dash"/>
  <path d="M 118 46 Q 164 128 268 182" class="curve"/>
  <circle cx="148" cy="88" r="4" fill="#2457a6"/>
  <circle cx="192" cy="134" r="4" fill="#2457a6"/>
  <text x="272" y="178" font-size="14" font-weight="600" style="fill:#2457a6">需求</text>
  <line x1="74" y1="130" x2="74" y2="95" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="82" y="116" class="note">1. 价格上升 22%……</text>
  <line x1="188" y1="196" x2="153" y2="196" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="170" y="252" class="note" text-anchor="middle">2. ……使需求量减少 22%</text>
</g>

<!-- (d) Elastic -->
<g transform="translate(190,342)">
  <text x="175" y="18" class="sub" text-anchor="middle">（d）富有弹性的需求：弹性大于 1</text>
  <line x1="58" y1="36" x2="58" y2="210" class="axis"/>
  <line x1="58" y1="210" x2="320" y2="210" class="axis"/>
  <text x="48" y="214" font-size="12.5" text-anchor="end">0</text>
  <text x="48" y="138" font-size="12.5" text-anchor="end">$4</text>
  <text x="48" y="92" font-size="12.5" text-anchor="end">$5</text>
  <text x="128" y="229" font-size="12.5" text-anchor="middle">50</text>
  <text x="220" y="229" font-size="12.5" text-anchor="middle">100</text>
  <text x="308" y="232" font-size="13" text-anchor="end">数量</text>
  <text x="16" y="125" font-size="13" text-anchor="middle" transform="rotate(-90 16 125)">价格</text>
  <line x1="58" y1="88" x2="128" y2="88" class="dash"/>
  <line x1="128" y1="88" x2="128" y2="210" class="dash"/>
  <line x1="58" y1="134" x2="220" y2="134" class="dash"/>
  <line x1="220" y1="134" x2="220" y2="210" class="dash"/>
  <line x1="88" y1="68" x2="296" y2="172" class="curve"/>
  <circle cx="128" cy="88" r="4" fill="#2457a6"/>
  <circle cx="220" cy="134" r="4" fill="#2457a6"/>
  <text x="282" y="158" font-size="14" font-weight="600" style="fill:#2457a6">需求</text>
  <line x1="72" y1="130" x2="72" y2="95" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="79" y="116" class="note">1. 价格上升 22%……</text>
  <line x1="214" y1="196" x2="134" y2="196" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="175" y="252" class="note" text-anchor="middle">2. ……使需求量减少 67%</text>
</g>

<!-- (e) Perfectly Elastic -->
<g transform="translate(565,342)">
  <text x="175" y="18" class="sub" text-anchor="middle">（e）完全有弹性的需求：弹性无穷大</text>
  <line x1="58" y1="36" x2="58" y2="210" class="axis"/>
  <line x1="58" y1="210" x2="320" y2="210" class="axis"/>
  <text x="48" y="214" font-size="12.5" text-anchor="end">0</text>
  <text x="48" y="124" font-size="12.5" text-anchor="end">$4</text>
  <text x="308" y="232" font-size="13" text-anchor="end">数量</text>
  <text x="16" y="125" font-size="13" text-anchor="middle" transform="rotate(-90 16 125)">价格</text>
  <line x1="58" y1="120" x2="296" y2="120" class="curve"/>
  <text x="282" y="110" font-size="14" font-weight="600" style="fill:#2457a6">需求</text>
  <text x="76" y="76" class="note">1. 价格高于 $4 时，需求量为 0</text>
  <text x="76" y="144" class="note">2. 价格正好为 $4 时，消费者将购买任何数量</text>
  <text x="76" y="176" class="note">3. 价格低于 $4 时，需求量无限大</text>
</g>
</svg>
