<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
<title id="title">图 5-2 总收益</title>
<desc id="desc">买者支付从而卖者得到的总收益等于需求曲线下方框的面积 P×Q。当价格为 4 美元、需求量为 100 时，总收益为 400 美元。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .curve{fill:none;stroke:#2457a6;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.3;stroke-dasharray:5 4}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="340" y="36" font-size="22" text-anchor="middle" font-weight="600">图 5-2 总收益</text>

<rect x="110" y="200" width="250" height="145" fill="#dbeafe"/>
<line x1="110" y1="68" x2="110" y2="345" class="axis"/>
<line x1="110" y1="345" x2="590" y2="345" class="axis"/>

<line x1="110" y1="200" x2="360" y2="200" class="dash"/>
<line x1="360" y1="200" x2="360" y2="345" class="dash"/>

<line x1="160" y1="95" x2="545" y2="297" class="curve"/>
<circle cx="360" cy="200" r="5" fill="#2457a6"/>

<text x="98" y="350" font-size="13.5" text-anchor="end">0</text>
<text x="98" y="205" font-size="14" font-weight="600" text-anchor="end">$4</text>
<text x="72" y="275" font-size="14" font-weight="600" style="fill:#1e3a8a">P</text>
<text x="360" y="368" font-size="14" font-weight="600" text-anchor="middle">100</text>
<text x="235" y="368" font-size="14" font-weight="600" text-anchor="middle" style="fill:#1e3a8a">Q</text>

<text x="355" y="396" font-size="15" text-anchor="middle">数量</text>
<text x="44" y="210" font-size="15" text-anchor="middle" transform="rotate(-90 44 210)">价格</text>

<text x="235" y="278" font-size="17" font-weight="600" text-anchor="middle" style="fill:#1e3a8a">P × Q = $400（收益）</text>
<text x="530" y="278" font-size="15" font-weight="600" style="fill:#2457a6">需求</text>
</svg>
