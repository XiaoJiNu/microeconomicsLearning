<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
<title id="title">图 5-4 一条线性需求曲线的弹性</title>
<desc id="desc">线性需求曲线斜率恒定（价格每上升1美元，需求量减少2单位），但弹性沿曲线改变：在价格高而数量少的上半段（价格4至7美元）弹性大于1；在3至4美元（数量6至8）之间为单位弹性；在价格低而数量多的下半段（价格0至3美元）弹性小于1。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .grid{stroke:#e4e7ec;stroke-width:1}
  .curve{fill:none;stroke:#2457a6;stroke-width:3.2}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="420" y="36" font-size="22" text-anchor="middle" font-weight="600">图 5-4 一条线性需求曲线的弹性</text>

<!-- Grid: Origin (120, 404). Each $1 = 44px up (P=7 at y=96). Each 2 units Q = 76px right (Q=14 at x=652). -->
<line x1="120" y1="96" x2="652" y2="96" class="grid"/>
<line x1="120" y1="140" x2="652" y2="140" class="grid"/>
<line x1="120" y1="184" x2="652" y2="184" class="grid"/>
<line x1="120" y1="228" x2="652" y2="228" class="grid"/>
<line x1="120" y1="272" x2="652" y2="272" class="grid"/>
<line x1="120" y1="316" x2="652" y2="316" class="grid"/>
<line x1="120" y1="360" x2="652" y2="360" class="grid"/>

<line x1="196" y1="80" x2="196" y2="404" class="grid"/>
<line x1="272" y1="80" x2="272" y2="404" class="grid"/>
<line x1="348" y1="80" x2="348" y2="404" class="grid"/>
<line x1="424" y1="80" x2="424" y2="404" class="grid"/>
<line x1="500" y1="80" x2="500" y2="404" class="grid"/>
<line x1="576" y1="80" x2="576" y2="404" class="grid"/>
<line x1="652" y1="80" x2="652" y2="404" class="grid"/>

<line x1="120" y1="74" x2="120" y2="404" class="axis"/>
<line x1="120" y1="404" x2="680" y2="404" class="axis"/>

<!-- Y-axis ticks -->
<text x="108" y="409" font-size="13" text-anchor="end">$0</text>
<text x="108" y="365" font-size="13" text-anchor="end">$1</text>
<text x="108" y="321" font-size="13" text-anchor="end">$2</text>
<text x="108" y="277" font-size="13" font-weight="600" text-anchor="end">$3</text>
<text x="108" y="233" font-size="13" font-weight="600" text-anchor="end">$4</text>
<text x="108" y="189" font-size="13" text-anchor="end">$5</text>
<text x="108" y="145" font-size="13" text-anchor="end">$6</text>
<text x="108" y="101" font-size="13" text-anchor="end">$7</text>

<!-- X-axis ticks -->
<text x="120" y="426" font-size="13" text-anchor="middle">0</text>
<text x="196" y="426" font-size="13" text-anchor="middle">2</text>
<text x="272" y="426" font-size="13" text-anchor="middle">4</text>
<text x="348" y="426" font-size="13" font-weight="600" text-anchor="middle">6</text>
<text x="424" y="426" font-size="13" font-weight="600" text-anchor="middle">8</text>
<text x="500" y="426" font-size="13" text-anchor="middle">10</text>
<text x="576" y="426" font-size="13" text-anchor="middle">12</text>
<text x="652" y="426" font-size="13" text-anchor="middle">14</text>

<text x="395" y="458" font-size="15" text-anchor="middle">数量</text>
<text x="54" y="245" font-size="15" text-anchor="middle" transform="rotate(-90 54 245)">价格</text>

<!-- Dashed guides for unit-elastic segment ($4,6) and ($3,8) -->
<line x1="120" y1="228" x2="348" y2="228" class="dash"/>
<line x1="348" y1="228" x2="348" y2="404" class="dash"/>
<line x1="120" y1="272" x2="424" y2="272" class="dash"/>
<line x1="424" y1="272" x2="424" y2="404" class="dash"/>

<!-- Linear demand line -->
<line x1="120" y1="96" x2="652" y2="404" class="curve"/>
<circle cx="120" cy="96" r="4.5" fill="#2457a6"/>
<circle cx="196" cy="140" r="4.5" fill="#2457a6"/>
<circle cx="272" cy="184" r="4.5" fill="#2457a6"/>
<circle cx="348" cy="228" r="5" fill="#b33a3a"/>
<circle cx="424" cy="272" r="5" fill="#b33a3a"/>
<circle cx="500" cy="316" r="4.5" fill="#2457a6"/>
<circle cx="576" cy="360" r="4.5" fill="#2457a6"/>
<circle cx="652" cy="404" r="4.5" fill="#2457a6"/>

<!-- Elasticity annotations -->
<path d="M 136 88 L 356 215" fill="none" stroke="#16805b" stroke-width="2" stroke-dasharray="3 3"/>
<text x="275" y="142" font-size="15" font-weight="600" style="fill:#16805b">弹性大于 1（富有弹性：高价低量）</text>

<line x1="392" y1="248" x2="452" y2="222" stroke="#b33a3a" stroke-width="1.8"/>
<text x="458" y="220" font-size="14.5" font-weight="600" style="fill:#b33a3a">弹性等于 1（单位弹性：$3–$4 区间，总收益最大 $24）</text>

<path d="M 434 263 L 656 391" fill="none" stroke="#c75b12" stroke-width="2" stroke-dasharray="3 3"/>
<text x="546" y="312" font-size="15" font-weight="600" style="fill:#c75b12">弹性小于 1（缺乏弹性：低价高量）</text>
</svg>
