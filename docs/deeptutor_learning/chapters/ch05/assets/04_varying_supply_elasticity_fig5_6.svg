<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">图 5-6 供给价格弹性会如何变动</title>
<desc id="desc">由于企业生产能力有最大值，低产量时有闲置产能，价格从3美元升至4美元（+29%）使供给量从100增至200（+67%），供给富有弹性（大于1）；高产量时接近最大生产能力，价格从12美元升至15美元（+22%）仅使供给量从500增至525（+5%），供给缺乏弹性（小于1）。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .curve{fill:none;stroke:#b33a3a;stroke-width:3.2}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="380" y="36" font-size="22" text-anchor="middle" font-weight="600">图 5-6 供给价格弹性会如何变动</text>

<line x1="105" y1="66" x2="105" y2="380" class="axis"/>
<line x1="105" y1="380" x2="670" y2="380" class="axis"/>

<!-- Coordinates:
  Q=100 -> x=190, P=$3 -> y=342
  Q=200 -> x=275, P=$4 -> y=322
  Q=500 -> x=530, P=$12 -> y=162
  Q=525 -> x=552, P=$15 -> y=102
-->
<line x1="105" y1="342" x2="190" y2="342" class="dash"/>
<line x1="190" y1="342" x2="190" y2="380" class="dash"/>
<line x1="105" y1="322" x2="275" y2="322" class="dash"/>
<line x1="275" y1="322" x2="275" y2="380" class="dash"/>

<line x1="105" y1="162" x2="530" y2="162" class="dash"/>
<line x1="530" y1="162" x2="530" y2="380" class="dash"/>
<line x1="105" y1="102" x2="552" y2="102" class="dash"/>
<line x1="552" y1="102" x2="552" y2="380" class="dash"/>

<path d="M 140 352 L 190 342 L 275 322 Q 485 272 530 162 L 552 102 L 560 76" class="curve"/>
<circle cx="190" cy="342" r="4.5" fill="#b33a3a"/>
<circle cx="275" cy="322" r="4.5" fill="#b33a3a"/>
<circle cx="530" cy="162" r="4.5" fill="#b33a3a"/>
<circle cx="552" cy="102" r="4.5" fill="#b33a3a"/>

<text x="94" y="385" font-size="13" text-anchor="end">0</text>
<text x="94" y="347" font-size="13" font-weight="600" text-anchor="end">$3</text>
<text x="94" y="325" font-size="13" font-weight="600" text-anchor="end">$4</text>
<text x="94" y="167" font-size="13" font-weight="600" text-anchor="end">$12</text>
<text x="94" y="107" font-size="13" font-weight="600" text-anchor="end">$15</text>

<text x="190" y="402" font-size="13" font-weight="600" text-anchor="middle">100</text>
<text x="275" y="402" font-size="13" font-weight="600" text-anchor="middle">200</text>
<text x="518" y="402" font-size="13" font-weight="600" text-anchor="middle">500</text>
<text x="566" y="402" font-size="13" font-weight="600" text-anchor="middle">525</text>

<text x="390" y="434" font-size="15" text-anchor="middle">数量</text>
<text x="42" y="225" font-size="15" text-anchor="middle" transform="rotate(-90 42 225)">价格</text>

<text x="572" y="84" font-size="15" font-weight="600" style="fill:#b33a3a">供给</text>
<text x="215" y="286" font-size="14.5" font-weight="600" style="fill:#16805b">弹性大（大于 1：有闲置产能）</text>
<text x="215" y="306" font-size="12.5" style="fill:#16805b">价格 +29% ⇒ 供给量 +67%</text>

<text x="305" y="125" font-size="14.5" font-weight="600" style="fill:#c75b12">弹性小（小于 1：接近最大产能）</text>
<text x="305" y="145" font-size="12.5" style="fill:#c75b12">价格 +22% ⇒ 供给量仅 +5%</text>
</svg>
