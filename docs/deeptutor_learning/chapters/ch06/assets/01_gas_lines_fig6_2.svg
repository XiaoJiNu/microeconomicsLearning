<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
<title id="title">图 6-2 有价格上限的汽油市场</title>
<desc id="desc">（a）OPEC 提价前均衡价格 P1 低于价格上限，价格上限非限制性；（b）原油涨价使汽油供给从 S1 左移到 S2，无管制均衡价格 P2 高于价格上限，价格上限变为限制性，导致需求量 QD 大于供给量 QS 的短缺。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .s1{fill:none;stroke:#b33a3a;stroke-width:2.8}
  .s2{fill:none;stroke:#c75b12;stroke-width:3;stroke-dasharray:6 4}
  .ceil{stroke:#16805b;stroke-width:2.5}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:13px;font-weight:600}
  .sub{font-size:16.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-g2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
  <marker id="arr-g2l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 6-2 有价格上限的汽油市场</text>

<!-- Panel (a): Non-binding before OPEC shock -->
<g transform="translate(20,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（a）汽油的价格上限是非限制性的</text>
  <line x1="85" y1="50" x2="85" y2="345" class="axis"/>
  <line x1="85" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Ceiling at y=165; P1 at y=215, Q1 at x=275 -->
  <line x1="85" y1="165" x2="445" y2="165" class="ceil"/>
  <line x1="85" y1="215" x2="275" y2="215" class="dash"/>
  <line x1="275" y1="215" x2="275" y2="345" class="dash"/>

  <line x1="135" y1="103" x2="415" y2="327" class="demand"/>
  <line x1="135" y1="327" x2="415" y2="103" class="s1"/>
  <circle cx="275" cy="215" r="5" fill="#17202a"/>

  <text x="74" y="350" font-size="13" text-anchor="end">0</text>
  <text x="74" y="220" font-size="13.5" font-weight="600" text-anchor="end">P₁</text>
  <text x="275" y="368" font-size="13.5" font-weight="600" text-anchor="middle">Q₁</text>
  <text x="275" y="402" font-size="14.5" text-anchor="middle">汽油数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">汽油价格</text>

  <text x="380" y="156" font-size="14" font-weight="600" style="fill:#16805b">价格上限</text>
  <text x="155" y="156" class="note">1. 最初，价格上限不是限制性的……</text>
  <text x="420" y="106" font-size="14.5" font-weight="600" style="fill:#b33a3a">S₁</text>
  <text x="420" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
</g>

<!-- Panel (b): Binding after supply shifts left -->
<g transform="translate(550,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（b）汽油的价格上限是限制性的</text>
  <line x1="85" y1="50" x2="85" y2="345" class="axis"/>
  <line x1="85" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Demand: y = 0.8*(x-275)+215 => at y=165 (ceiling), Qd at x=212.5
       S1: y = -0.8*(x-275)+215
       S2 shifted left by 125px: y = -0.8*(x-150)+215 => intersects D at x=212.5? Wait: let S2 shift left by 150px: y = -0.8*(x-125)+215
       Intersection P2 with D: 0.8*(x-275) = -0.8*(x-125) => x=200, y=155? Let's shift S2 higher so P2 is clearly above ceiling y=185!
       Let Ceiling be y=195, P1 at y=235 (x=285):
       D: y = 0.8*(x-285)+235 => at y=195, x_D = 235.
       S1: y = -0.8*(x-285)+235.
       S2: y = -0.8*(x-145)+235 => at y=195, x_S = 195? Wait: -0.8*(x-145)+235=195 => -0.8*(x-145)=-40 => x-145=50 => x_S=195? No, S slopes UP so lower y means larger x! At P2 (intersection): 0.8*(x-285) = -0.8*(x-145) => x=215, y = 0.8*(-70)+235 = 179? Let's make it super wide and clear!
       Let D: (125, 95) to (415, 327), slope = 0.8. At y=199 (Ceiling): x_D = 125 + (199-95)/0.8 = 255!
       Let S1: (155, 327) to (445, 95), slope = -0.8. Intersects D at x=285, y=223 (P1)!
       Let S2: shifted up/left by 130px horizontally: (85, 279) to (315, 95), formula y = 95 - 0.8*(x-315).
       Check intersection P2 with D: 95 + 0.8*(x-125) = 95 - 0.8*(x-315) => x-125 = 315-x => x=220, y = 95 + 0.8*95 = 171 (P2, well above Ceiling y=199!).
       At Ceiling y=199 on S2: 199 = 95 - 0.8*(x-315) => 0.8*(315-x) = 104 => 315-x = 130 => x_S = 185!
       So at Ceiling y=199: Q_S is at x=185, Q_D is at x=255! Crystal clear! -->
  <line x1="85" y1="223" x2="285" y2="223" class="dash"/>
  <line x1="85" y1="171" x2="220" y2="171" class="dash"/>
  <line x1="85" y1="199" x2="445" y2="199" class="ceil"/>
  <line x1="185" y1="199" x2="185" y2="345" class="dash"/>
  <line x1="255" y1="199" x2="255" y2="345" class="dash"/>

  <line x1="125" y1="95" x2="415" y2="327" class="demand"/>
  <line x1="155" y1="327" x2="445" y2="95" class="s1"/>
  <line x1="95" y1="271" x2="315" y2="95" class="s2"/>

  <circle cx="285" cy="223" r="4" fill="#667085"/>
  <circle cx="220" cy="171" r="4" fill="#667085"/>
  <circle cx="185" cy="199" r="5" fill="#c75b12"/>
  <circle cx="255" cy="199" r="5" fill="#2457a6"/>

  <text x="74" y="350" font-size="13" text-anchor="end">0</text>
  <text x="74" y="228" font-size="13" text-anchor="end">P₁</text>
  <text x="74" y="175" font-size="13.5" font-weight="600" text-anchor="end">P₂</text>
  <text x="182" y="368" font-size="13.5" font-weight="600" text-anchor="middle" style="fill:#c75b12">Q<tspan dy="3" font-size="10">S</tspan></text>
  <text x="258" y="368" font-size="13.5" font-weight="600" text-anchor="middle" style="fill:#2457a6">Q<tspan dy="3" font-size="10">D</tspan></text>
  <text x="275" y="402" font-size="14.5" text-anchor="middle">汽油数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">汽油价格</text>

  <text x="448" y="99" font-size="14.5" font-weight="600" style="fill:#b33a3a">S₁</text>
  <text x="320" y="98" font-size="14.5" font-weight="600" style="fill:#c75b12">S₂</text>
  <text x="420" y="330" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
  <text x="385" y="191" font-size="13.5" font-weight="600" style="fill:#16805b">价格上限</text>

  <line x1="365" y1="128" x2="292" y2="128" stroke="#16805b" stroke-width="2" marker-end="url(#arr-g2)"/>
  <text x="260" y="76" class="note">2. ……但当供给减少时……</text>
  <text x="290" y="218" class="note">3. ……价格上限变为限制性的……</text>
  <line x1="192" y1="246" x2="248" y2="246" stroke="#16805b" stroke-width="2" marker-start="url(#arr-g2l)" marker-end="url(#arr-g2)"/>
  <text x="220" y="268" class="note" text-anchor="middle">4. ……引起短缺</text>
</g>
</svg>
