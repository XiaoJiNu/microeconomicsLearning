<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">图 6-7 向买者征税</title>
<desc id="desc">向买者征收每单位 0.50 美元税收时，需求曲线从 D1 向下移动 0.50 美元到 D2。均衡数量同样从 100 减为 90；卖者得到的价格从 3.00 美元降至 2.80 美元，买者含税支付的价格从 3.00 美元升至 3.30 美元，与向卖者征税完全等同。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .d1{fill:none;stroke:#2457a6;stroke-width:2.8}
  .d2{fill:none;stroke:#1d4ed8;stroke-width:3;stroke-dasharray:6 4}
  .s1{fill:none;stroke:#b33a3a;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<defs>
  <marker id="arr-tb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="400" y="36" font-size="22" text-anchor="middle" font-weight="600">图 6-7 向买者征税</text>

<line x1="210" y1="68" x2="210" y2="380" class="axis"/>
<line x1="210" y1="380" x2="710" y2="380" class="axis"/>

<!-- Identical numerical geometry to Fig 6-6!
  $3.30 at y=184, $3.00 at y=226, $2.80 at y=254; Q=90 at x=394, Q=100 at x=450.
  D1: from (250, 76) to (630, 361).
  D2 = D1 shifted DOWN by 70px ($0.50): passes through (394, 254) -> from (250, 146) to (550, 371).
  S1: from (250, 326) to (650, 126).
-->
<line x1="210" y1="184" x2="394" y2="184" class="dash"/>
<line x1="210" y1="226" x2="450" y2="226" class="dash"/>
<line x1="210" y1="254" x2="394" y2="254" class="dash"/>
<line x1="394" y1="184" x2="394" y2="380" class="dash"/>
<line x1="450" y1="226" x2="450" y2="380" class="dash"/>

<line x1="250" y1="326" x2="650" y2="126" class="s1"/>
<line x1="250" y1="76" x2="630" y2="361" class="d1"/>
<line x1="250" y1="146" x2="550" y2="371" class="d2"/>

<!-- Tax wedge segment at Q=90 -->
<line x1="394" y1="184" x2="394" y2="254" stroke="#16805b" stroke-width="4"/>
<circle cx="450" cy="226" r="5" fill="#17202a"/>
<circle cx="394" cy="184" r="5" fill="#2457a6"/>
<circle cx="394" cy="254" r="5" fill="#b33a3a"/>

<!-- Downward shift arrow between D1 and D2 at x=530 (D1 y=286, D2 y=356) -->
<line x1="530" y1="290" x2="530" y2="350" stroke="#16805b" stroke-width="2.2" marker-end="url(#arr-tb)"/>
<text x="542" y="314" font-size="13" font-weight="600" style="fill:#16805b">向买者征税使需求曲线</text>
<text x="542" y="332" font-size="13" font-weight="600" style="fill:#16805b">向下移动税收量（$0.50）</text>

<!-- Labels -->
<text x="198" y="385" font-size="13" text-anchor="end">0</text>
<text x="198" y="188" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#2457a6">买者支付的价格 $3.30</text>
<text x="198" y="230" font-size="13.5" text-anchor="end">没有税收时的价格 $3.00</text>
<text x="198" y="259" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#b33a3a">卖者得到的价格 $2.80</text>

<text x="394" y="402" font-size="13.5" font-weight="600" text-anchor="middle">90</text>
<text x="450" y="402" font-size="13.5" font-weight="600" text-anchor="middle">100</text>
<text x="460" y="436" font-size="15" text-anchor="middle">冰淇淋蛋卷的数量（个）</text>
<text x="26" y="226" font-size="15" text-anchor="middle" transform="rotate(-90 26 226)">冰淇淋蛋卷的价格</text>

<text x="382" y="218" font-size="13.5" font-weight="700" text-anchor="end" style="fill:#16805b">税收（$0.50）</text>
<text x="462" y="220" font-size="13" style="fill:#475467">无税时的均衡</text>
<text x="404" y="268" font-size="13" font-weight="600" style="fill:#b33a3a">有税时的均衡</text>

<text x="656" y="130" font-size="15" font-weight="600" style="fill:#b33a3a">供给，S₁</text>
<text x="636" y="365" font-size="15" font-weight="600" style="fill:#2457a6">D₁</text>
<text x="518" y="368" font-size="15" font-weight="600" style="fill:#1d4ed8">D₂</text>
</svg>
