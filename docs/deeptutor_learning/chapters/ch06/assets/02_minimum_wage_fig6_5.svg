<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
<title id="title">图 6-5 最低工资如何影响劳动市场</title>
<desc id="desc">（a）自由劳动市场中工资自发调整，实现均衡工资与均衡就业；（b）高于均衡工资的最低工资使劳动供给量大于劳动需求量，产生劳动过剩（失业）。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .supply{fill:none;stroke:#b33a3a;stroke-width:3}
  .floor{stroke:#c75b12;stroke-width:2.6}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .sub{font-size:16.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-ml" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#c75b12"/></marker>
  <marker id="arr-mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c75b12"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 6-5 最低工资如何影响劳动市场</text>

<!-- Panel (a): Free Labor Market -->
<g transform="translate(20,54)">
  <text x="255" y="20" class="sub" text-anchor="middle">（a）自由的劳动市场</text>
  <line x1="100" y1="50" x2="100" y2="345" class="axis"/>
  <line x1="100" y1="345" x2="470" y2="345" class="axis"/>

  <line x1="100" y1="195" x2="275" y2="195" class="dash"/>
  <line x1="275" y1="195" x2="275" y2="345" class="dash"/>

  <line x1="135" y1="83" x2="425" y2="315" class="demand"/>
  <line x1="135" y1="307" x2="425" y2="75" class="supply"/>
  <circle cx="275" cy="195" r="5" fill="#17202a"/>

  <text x="90" y="350" font-size="13" text-anchor="end">0</text>
  <text x="92" y="200" font-size="13" font-weight="600" text-anchor="end">均衡工资</text>
  <text x="275" y="368" font-size="13" font-weight="600" text-anchor="middle">均衡就业</text>
  <text x="285" y="404" font-size="14.5" text-anchor="middle">劳动数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">工资</text>

  <text x="415" y="70" font-size="14" font-weight="600" style="fill:#b33a3a">劳动供给</text>
  <text x="415" y="330" font-size="14" font-weight="600" style="fill:#2457a6">劳动需求</text>
</g>

<!-- Panel (b): Labor Market with Binding Minimum Wage -->
<g transform="translate(550,54)">
  <text x="255" y="20" class="sub" text-anchor="middle">（b）有限制性最低工资的劳动市场</text>
  <line x1="100" y1="50" x2="100" y2="345" class="axis"/>
  <line x1="100" y1="345" x2="470" y2="345" class="axis"/>

  <line x1="100" y1="135" x2="450" y2="135" class="floor"/>
  <line x1="200" y1="135" x2="200" y2="345" class="dash"/>
  <line x1="350" y1="135" x2="350" y2="345" class="dash"/>

  <line x1="135" y1="83" x2="425" y2="315" class="demand"/>
  <line x1="135" y1="307" x2="425" y2="75" class="supply"/>
  <circle cx="200" cy="135" r="5" fill="#2457a6"/>
  <circle cx="350" cy="135" r="5" fill="#b33a3a"/>

  <text x="90" y="350" font-size="13" text-anchor="end">0</text>
  <text x="92" y="140" font-size="13" font-weight="600" text-anchor="end" style="fill:#c75b12">最低工资</text>
  <text x="200" y="368" font-size="13" font-weight="600" text-anchor="middle" style="fill:#2457a6">需求量</text>
  <text x="350" y="368" font-size="13" font-weight="600" text-anchor="middle" style="fill:#b33a3a">供给量</text>
  <text x="285" y="404" font-size="14.5" text-anchor="middle">劳动数量</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">工资</text>

  <line x1="208" y1="114" x2="342" y2="114" stroke="#c75b12" stroke-width="2.2" marker-start="url(#arr-ml)" marker-end="url(#arr-mr)"/>
  <text x="275" y="102" font-size="14" font-weight="700" text-anchor="middle" style="fill:#c75b12">劳动过剩（失业）</text>
  <text x="415" y="70" font-size="14" font-weight="600" style="fill:#b33a3a">劳动供给</text>
  <text x="415" y="330" font-size="14" font-weight="600" style="fill:#2457a6">劳动需求</text>
</g>
</svg>
