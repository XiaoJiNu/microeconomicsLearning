<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" role="img" aria-labelledby="title desc">
<title id="title">图 6-1 有价格上限的市场</title>
<desc id="desc">（a）价格上限为 4 美元，高于均衡价格 3 美元，非限制性，市场达到 3 美元、100 个的均衡；（b）价格上限为 2 美元，低于均衡价格 3 美元，具有限制性，需求量 125 个大于供给量 75 个，产生 50 个冰淇淋蛋卷的短缺。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .supply{fill:none;stroke:#b33a3a;stroke-width:3}
  .ceil{stroke:#16805b;stroke-width:2.6}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .sub{font-size:16.5px;font-weight:600}
</style>
<defs>
  <marker id="arr-cl" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#16805b"/></marker>
  <marker id="arr-cr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="530" y="34" font-size="22" text-anchor="middle" font-weight="600">图 6-1 有价格上限的市场</text>

<!-- Panel (a): Non-binding Price Ceiling ($4 > $3) -->
<g transform="translate(20,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（a）非限制性的价格上限</text>
  <line x1="85" y1="50" x2="85" y2="345" class="axis"/>
  <line x1="85" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Equilibrium at (265, 195) [$3, 100]. Ceiling $4 at y=135 -->
  <line x1="85" y1="195" x2="265" y2="195" class="dash"/>
  <line x1="265" y1="195" x2="265" y2="345" class="dash"/>
  <line x1="85" y1="135" x2="445" y2="135" class="ceil"/>

  <line x1="125" y1="83" x2="415" y2="315" class="demand"/>
  <line x1="125" y1="307" x2="415" y2="75" class="supply"/>
  <circle cx="265" cy="195" r="5" fill="#17202a"/>

  <text x="74" y="350" font-size="13" text-anchor="end">0</text>
  <text x="74" y="200" font-size="13.5" font-weight="600" text-anchor="end">$3</text>
  <text x="74" y="140" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#16805b">$4</text>
  <text x="265" y="366" font-size="13.5" font-weight="600" text-anchor="middle">100</text>
  <text x="265" y="384" font-size="12" text-anchor="middle" style="fill:#475467">均衡数量</text>
  <text x="275" y="412" font-size="14.5" text-anchor="middle">冰淇淋蛋卷的数量（个）</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">冰淇淋蛋卷的价格</text>

  <text x="385" y="126" font-size="14" font-weight="600" style="fill:#16805b">价格上限</text>
  <text x="155" y="212" font-size="12.5" style="fill:#475467">均衡价格</text>
  <text x="420" y="78" font-size="14.5" font-weight="600" style="fill:#b33a3a">供给</text>
  <text x="420" y="318" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
</g>

<!-- Panel (b): Binding Price Ceiling ($2 < $3) -->
<g transform="translate(550,54)">
  <text x="245" y="20" class="sub" text-anchor="middle">（b）限制性的价格上限</text>
  <line x1="85" y1="50" x2="85" y2="345" class="axis"/>
  <line x1="85" y1="345" x2="465" y2="345" class="axis"/>

  <!-- Equilibrium ($3) at (265, 195). Ceiling ($2) at y=255 => Qs=75 at x=190, Qd=125 at x=340 -->
  <line x1="85" y1="195" x2="265" y2="195" class="dash"/>
  <line x1="85" y1="255" x2="445" y2="255" class="ceil"/>
  <line x1="190" y1="255" x2="190" y2="345" class="dash"/>
  <line x1="340" y1="255" x2="340" y2="345" class="dash"/>

  <line x1="125" y1="83" x2="415" y2="315" class="demand"/>
  <line x1="125" y1="307" x2="415" y2="75" class="supply"/>
  <circle cx="265" cy="195" r="4.5" fill="#667085"/>
  <circle cx="190" cy="255" r="5" fill="#b33a3a"/>
  <circle cx="340" cy="255" r="5" fill="#2457a6"/>

  <text x="74" y="350" font-size="13" text-anchor="end">0</text>
  <text x="74" y="200" font-size="13.5" text-anchor="end">$3</text>
  <text x="74" y="260" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#16805b">$2</text>
  <text x="190" y="366" font-size="13.5" font-weight="600" text-anchor="middle">75</text>
  <text x="340" y="366" font-size="13.5" font-weight="600" text-anchor="middle">125</text>
  <text x="190" y="384" font-size="12" text-anchor="middle" style="fill:#b33a3a">供给量</text>
  <text x="340" y="384" font-size="12" text-anchor="middle" style="fill:#2457a6">需求量</text>
  <text x="275" y="412" font-size="14.5" text-anchor="middle">冰淇淋蛋卷的数量（个）</text>
  <text x="22" y="200" font-size="14.5" text-anchor="middle" transform="rotate(-90 22 200)">冰淇淋蛋卷的价格</text>

  <line x1="198" y1="278" x2="332" y2="278" stroke="#16805b" stroke-width="2.2" marker-start="url(#arr-cl)" marker-end="url(#arr-cr)"/>
  <text x="265" y="298" font-size="14" font-weight="600" text-anchor="middle" style="fill:#16805b">短缺 = 50</text>
  <text x="385" y="246" font-size="14" font-weight="600" style="fill:#16805b">价格上限</text>
  <text x="155" y="188" font-size="12.5" style="fill:#475467">均衡价格</text>
  <text x="420" y="78" font-size="14.5" font-weight="600" style="fill:#b33a3a">供给</text>
  <text x="420" y="318" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>
</g>
</svg>
