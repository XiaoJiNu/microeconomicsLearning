<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">图 6-8 工薪税</title>
<desc id="desc">工薪税是打入企业支付的工资与工人得到的工资之间的一个税收楔子。工人得到的工资下降、企业支付的工资上升，税负由工人与企业分摊，且分配比例与立法向谁征收无关。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .supply{fill:none;stroke:#b33a3a;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="380" y="36" font-size="22" text-anchor="middle" font-weight="600">图 6-8 工薪税</text>

<line x1="185" y1="68" x2="185" y2="365" class="axis"/>
<line x1="185" y1="365" x2="675" y2="365" class="axis"/>

<!-- Equilibrium at (445, 215). Tax wedge at x=365: D at y=165, S at y=265 -->
<line x1="185" y1="165" x2="365" y2="165" class="dash"/>
<line x1="185" y1="215" x2="445" y2="215" class="dash"/>
<line x1="185" y1="265" x2="365" y2="265" class="dash"/>

<line x1="245" y1="90" x2="625" y2="327" class="demand"/>
<line x1="245" y1="340" x2="625" y2="103" class="supply"/>

<line x1="365" y1="165" x2="365" y2="265" stroke="#16805b" stroke-width="4"/>
<circle cx="445" cy="215" r="5" fill="#667085"/>
<circle cx="365" cy="165" r="5" fill="#2457a6"/>
<circle cx="365" cy="265" r="5" fill="#b33a3a"/>

<text x="174" y="370" font-size="13" text-anchor="end">0</text>
<text x="174" y="170" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#2457a6">企业支付的工资</text>
<text x="174" y="220" font-size="13.5" text-anchor="end">没有税收时的工资</text>
<text x="174" y="270" font-size="13.5" font-weight="600" text-anchor="end" style="fill:#b33a3a">工人得到的工资</text>

<text x="430" y="405" font-size="15" text-anchor="middle">劳动量</text>
<text x="26" y="215" font-size="15" text-anchor="middle" transform="rotate(-90 26 215)">工资</text>

<text x="352" y="205" font-size="14" font-weight="700" text-anchor="end" style="fill:#16805b">税收楔子</text>
<text x="630" y="106" font-size="15" font-weight="600" style="fill:#b33a3a">劳动供给</text>
<text x="630" y="330" font-size="15" font-weight="600" style="fill:#2457a6">劳动需求</text>
</svg>
