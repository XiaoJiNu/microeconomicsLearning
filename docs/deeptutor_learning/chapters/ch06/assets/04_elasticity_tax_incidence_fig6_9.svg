<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">图 6-9 税收负担如何分摊</title>
<desc id="desc">（a）供给富有弹性而需求缺乏弹性时，买者支付的价格大幅上升而卖者得到的价格只略微下降，买者承担大部分税收负担；（b）供给缺乏弹性而需求富有弹性时，买者支付的价格只略微上升而卖者得到的价格大幅下降，卖者承担大部分税收负担。</desc>
<style>
  text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}
  .axis{stroke:#344054;stroke-width:1.8}
  .demand{fill:none;stroke:#2457a6;stroke-width:3}
  .supply{fill:none;stroke:#b33a3a;stroke-width:3}
  .dash{stroke:#667085;stroke-width:1.2;stroke-dasharray:4 3}
  .note{fill:#16805b;font-size:13px;font-weight:600}
  .sub{font-size:16px;font-weight:600}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="550" y="34" font-size="22" text-anchor="middle" font-weight="600">图 6-9 税收负担如何分摊</text>

<!-- Panel (a): Elastic Supply, Inelastic Demand => Buyers bear most of the tax -->
<g transform="translate(15,54)">
  <text x="265" y="20" class="sub" text-anchor="middle">（a）供给富有弹性，需求缺乏弹性</text>
  <line x1="145" y1="50" x2="145" y2="350" class="axis"/>
  <line x1="145" y1="350" x2="505" y2="350" class="axis"/>

  <!-- Steep D: passes through (310, 232) [no-tax eq] and (276, 130) [buyer price, slope=3.0]
       Flat S: passes through (310, 232) [no-tax eq] and (276, 244) [seller price, slope=-0.35]
       Tax wedge at x=276: buyer pays y=130 (+102px!), seller receives y=244 (-12px!) -->
  <line x1="145" y1="130" x2="276" y2="130" class="dash"/>
  <line x1="145" y1="232" x2="310" y2="232" class="dash"/>
  <line x1="145" y1="244" x2="276" y2="244" class="dash"/>

  <line x1="185" y1="276" x2="480" y2="172" class="supply"/>
  <line x1="254" y1="64" x2="345" y2="337" class="demand"/>

  <line x1="276" y1="130" x2="276" y2="244" stroke="#16805b" stroke-width="4"/>
  <circle cx="310" cy="232" r="4.5" fill="#667085"/>
  <circle cx="276" cy="130" r="5" fill="#2457a6"/>
  <circle cx="276" cy="244" r="5" fill="#b33a3a"/>

  <text x="135" y="355" font-size="13" text-anchor="end">0</text>
  <text x="136" y="134" font-size="12.5" font-weight="600" text-anchor="end" style="fill:#2457a6">买者支付的价格</text>
  <text x="136" y="229" font-size="12.5" text-anchor="end">无税时的价格</text>
  <text x="136" y="253" font-size="12.5" font-weight="600" text-anchor="end" style="fill:#b33a3a">卖者得到的价格</text>
  <text x="325" y="392" font-size="14.5" text-anchor="middle">数量</text>
  <text x="18" y="205" font-size="14.5" text-anchor="middle" transform="rotate(-90 18 205)">价格</text>

  <text x="266" y="190" font-size="13" font-weight="700" text-anchor="end" style="fill:#16805b">税收</text>
  <text x="484" y="176" font-size="14.5" font-weight="600" style="fill:#b33a3a">供给</text>
  <text x="352" y="335" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>

  <text x="335" y="96" class="note">1. 当供给比需求富有弹性时……</text>
  <path d="M 284 132 L 292 132 L 292 230 L 284 230" fill="none" stroke="#2457a6" stroke-width="1.8"/>
  <text x="302" y="182" font-size="13" font-weight="700" style="fill:#2457a6">2. ……税收负担更多地</text>
  <text x="302" y="200" font-size="13" font-weight="700" style="fill:#2457a6">落在消费者身上</text>
</g>

<!-- Panel (b): Inelastic Supply, Elastic Demand => Sellers bear most of the tax -->
<g transform="translate(555,54)">
  <text x="265" y="20" class="sub" text-anchor="middle">（b）供给缺乏弹性，需求富有弹性</text>
  <line x1="145" y1="50" x2="145" y2="350" class="axis"/>
  <line x1="145" y1="350" x2="505" y2="350" class="axis"/>

  <!-- Steep S: passes through (310, 178) [no-tax eq] and (276, 280) [seller price, slope=-3.0]
       Flat D: passes through (310, 178) [no-tax eq] and (276, 166) [buyer price, slope=0.35]
       Tax wedge at x=276: buyer pays y=166 (+12px!), seller receives y=280 (-102px!) -->
  <line x1="145" y1="166" x2="276" y2="166" class="dash"/>
  <line x1="145" y1="178" x2="310" y2="178" class="dash"/>
  <line x1="145" y1="280" x2="276" y2="280" class="dash"/>

  <line x1="254" y1="346" x2="345" y2="73" class="supply"/>
  <line x1="185" y1="134" x2="480" y2="238" class="demand"/>

  <line x1="276" y1="166" x2="276" y2="280" stroke="#16805b" stroke-width="4"/>
  <circle cx="310" cy="178" r="4.5" fill="#667085"/>
  <circle cx="276" cy="166" r="5" fill="#2457a6"/>
  <circle cx="276" cy="280" r="5" fill="#b33a3a"/>

  <text x="135" y="355" font-size="13" text-anchor="end">0</text>
  <text x="136" y="164" font-size="12.5" font-weight="600" text-anchor="end" style="fill:#2457a6">买者支付的价格</text>
  <text x="136" y="186" font-size="12.5" text-anchor="end">无税时的价格</text>
  <text x="136" y="284" font-size="12.5" font-weight="600" text-anchor="end" style="fill:#b33a3a">卖者得到的价格</text>
  <text x="325" y="392" font-size="14.5" text-anchor="middle">数量</text>
  <text x="18" y="205" font-size="14.5" text-anchor="middle" transform="rotate(-90 18 205)">价格</text>

  <text x="266" y="232" font-size="13" font-weight="700" text-anchor="end" style="fill:#16805b">税收</text>
  <text x="352" y="80" font-size="14.5" font-weight="600" style="fill:#b33a3a">供给</text>
  <text x="484" y="242" font-size="14.5" font-weight="600" style="fill:#2457a6">需求</text>

  <text x="348" y="128" class="note">1. 当需求比供给富有弹性时……</text>
  <path d="M 284 180 L 292 180 L 292 278 L 284 278" fill="none" stroke="#b33a3a" stroke-width="1.8"/>
  <text x="302" y="252" font-size="13" font-weight="700" style="fill:#b33a3a">2. ……税收负担更多地</text>
  <text x="302" y="270" font-size="13" font-weight="700" style="fill:#b33a3a">落在生产者身上</text>
</g>
</svg>
