<svg xmlns="http://www.w3.org/2000/svg" width="740" height="540" viewBox="0 0 740 540" role="img" aria-labelledby="title desc">
<title id="title">图 4-11 供给减少如何影响均衡</title><desc id="desc">台风推高糖价使冰淇淋供给曲线从 S1 左移到 S2，均衡价格从 2.00 美元升至 2.50 美元，均衡数量从 7 个减至 4 个。</desc>
