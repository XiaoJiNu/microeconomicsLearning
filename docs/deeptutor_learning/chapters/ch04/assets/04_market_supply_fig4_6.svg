<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="480" viewBox="0 0 1140 480" role="img" aria-labelledby="title desc">
<title id="title">图 4-6 市场供给是个人供给之和</title><desc id="desc">在每一个既定价格下，把 Ben 的供给量与 Jerry 的供给量水平相加得到市场供给曲线；例如 2.00 美元时 3 + 4 = 7 个。</desc>
<style>text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}.axis{stroke:#344054;stroke-width:1.7}.grid{stroke:#eaecf0;stroke-width:1}.red{stroke:#b33a3a}.orange{stroke:#c75b12}.green{stroke:#16805b}.gray{stroke:#667085}.curve{fill:none;stroke-width:3}.dash{stroke-dasharray:5 4}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="570" y="34" font-size="22" text-anchor="middle" font-weight="600">图 4-6 市场供给是个人供给之和（同一价格下水平相加）</text>

<!-- Panel 1: Ben -->
<text x="182" y="72" font-size="17" text-anchor="middle" font-weight="600">Ben 的供给</text>
<line x1="70" y1="90" x2="70" y2="395" class="axis"/>
<line x1="70" y1="395" x2="300" y2="395" class="axis"/>
<text x="60" y="400" font-size="12" text-anchor="end">0</text>
<text x="60" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="60" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="60" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="98" y="416" font-size="12" text-anchor="middle">1</text>
<text x="154" y="416" font-size="12" text-anchor="middle" font-weight="600">3</text>
<text x="210" y="416" font-size="12" text-anchor="middle">5</text>
<text x="266" y="416" font-size="12" text-anchor="middle">7</text>
<text x="185" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<text x="18" y="245" font-size="14" text-anchor="middle" transform="rotate(-90 18 245)">价格</text>
<line x1="70" y1="195" x2="154" y2="195" class="gray dash"/>
<line x1="154" y1="195" x2="154" y2="395" class="gray dash"/>
<polyline points="70,395 70,345 98,295 126,245 154,195 182,145 210,95" class="curve red"/>
<circle cx="154" cy="195" r="5" fill="#b33a3a"/>
<text x="218" y="102" font-size="14" font-weight="600" style="fill:#b33a3a">S_Ben</text>

<!-- Plus Sign -->
<text x="336" y="252" font-size="30" text-anchor="middle" font-weight="700">+</text>

<!-- Panel 2: Jerry -->
<text x="500" y="72" font-size="17" text-anchor="middle" font-weight="600">Jerry 的供给</text>
<line x1="385" y1="90" x2="385" y2="395" class="axis"/>
<line x1="385" y1="395" x2="625" y2="395" class="axis"/>
<text x="375" y="400" font-size="12" text-anchor="end">0</text>
<text x="375" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="375" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="375" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="441" y="416" font-size="12" text-anchor="middle">2</text>
<text x="497" y="416" font-size="12" text-anchor="middle" font-weight="600">4</text>
<text x="553" y="416" font-size="12" text-anchor="middle">6</text>
<text x="609" y="416" font-size="12" text-anchor="middle">8</text>
<text x="505" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<line x1="385" y1="195" x2="497" y2="195" class="gray dash"/>
<line x1="497" y1="195" x2="497" y2="395" class="gray dash"/>
<polyline points="385,395 385,295 441,245 497,195 553,145 609,95" class="curve orange"/>
<circle cx="497" cy="195" r="5" fill="#c75b12"/>
<text x="550" y="105" font-size="14" text-anchor="end" font-weight="600" style="fill:#c75b12">S_Jerry</text>

<!-- Equals Sign -->
<text x="662" y="252" font-size="30" text-anchor="middle" font-weight="700">=</text>

<!-- Panel 3: Market -->
<text x="905" y="72" font-size="17" text-anchor="middle" font-weight="600">市场供给</text>
<line x1="710" y1="90" x2="710" y2="395" class="axis"/>
<line x1="710" y1="395" x2="1105" y2="395" class="axis"/>
<text x="700" y="400" font-size="12" text-anchor="end">0</text>
<text x="700" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="700" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="700" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="737" y="416" font-size="12" text-anchor="middle">1</text>
<text x="818" y="416" font-size="12" text-anchor="middle">4</text>
<text x="899" y="416" font-size="12" text-anchor="middle" font-weight="600">7</text>
<text x="980" y="416" font-size="12" text-anchor="middle">10</text>
<text x="1061" y="416" font-size="12" text-anchor="middle">13</text>
<text x="905" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<line x1="710" y1="195" x2="899" y2="195" class="gray dash"/>
<line x1="899" y1="195" x2="899" y2="395" class="gray dash"/>
<polyline points="710,395 710,345 737,295 818,245 899,195 980,145 1061,95" class="curve green"/>
<circle cx="899" cy="195" r="5.5" fill="#16805b"/>
<text x="912" y="218" font-size="14" font-weight="600" style="fill:#16805b">$2.00 时：3 + 4 = 7</text>
<text x="1025" y="102" font-size="14" text-anchor="end" font-weight="600" style="fill:#16805b">S_市场</text>
</svg>
