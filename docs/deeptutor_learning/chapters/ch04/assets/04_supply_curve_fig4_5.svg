<text x="94" y="327" font-size="14" text-anchor="middle" font-weight="600">$2.00</text><text x="218" y="327" font-size="14" text-anchor="middle" font-weight="600">3</text>
<line x1="32" y1="341" x2="280" y2="341" class="tbl"/>
