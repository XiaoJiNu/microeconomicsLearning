<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="480" viewBox="0 0 1140 480" role="img" aria-labelledby="title desc">
<title id="title">图 4-2 市场需求是个人需求之和</title><desc id="desc">在每一个既定价格下，把 Catherine 的需求量与 Nicholas 的需求量水平相加得到市场需求曲线；例如 2.00 美元时 4 + 3 = 7 个。</desc>
<style>text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}.axis{stroke:#344054;stroke-width:1.7}.blue{stroke:#2457a6}.orange{stroke:#c75b12}.green{stroke:#16805b}.gray{stroke:#667085}.curve{fill:none;stroke-width:3}.dash{stroke-dasharray:5 4}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="570" y="34" font-size="22" text-anchor="middle" font-weight="600">图 4-2 市场需求是个人需求之和（同一价格下水平相加）</text>

<!-- Panel 1: Catherine -->
<text x="185" y="72" font-size="17" text-anchor="middle" font-weight="600">Catherine 的需求</text>
<line x1="70" y1="90" x2="70" y2="395" class="axis"/>
<line x1="70" y1="395" x2="315" y2="395" class="axis"/>
<text x="60" y="400" font-size="12" text-anchor="end">0</text>
<text x="60" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="60" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="60" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="146" y="416" font-size="12" text-anchor="middle" font-weight="600">4</text>
<text x="222" y="416" font-size="12" text-anchor="middle">8</text>
<text x="298" y="416" font-size="12" text-anchor="middle">12</text>
<text x="190" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<text x="18" y="245" font-size="14" text-anchor="middle" transform="rotate(-90 18 245)">价格</text>
<line x1="70" y1="195" x2="146" y2="195" class="gray dash"/>
<line x1="146" y1="195" x2="146" y2="395" class="gray dash"/>
<polyline points="70,95 146,195 222,295 298,395" class="curve blue"/>
<circle cx="146" cy="195" r="5" fill="#2457a6"/>
<text x="218" y="268" font-size="14" font-weight="600" style="fill:#2457a6">D<tspan dy="4" font-size="11">Catherine</tspan></text>

<!-- Plus Sign -->
<text x="348" y="252" font-size="30" text-anchor="middle" font-weight="700">+</text>

<!-- Panel 2: Nicholas -->
<text x="498" y="72" font-size="17" text-anchor="middle" font-weight="600">Nicholas 的需求</text>
<line x1="390" y1="90" x2="390" y2="395" class="axis"/>
<line x1="390" y1="395" x2="615" y2="395" class="axis"/>
<text x="380" y="400" font-size="12" text-anchor="end">0</text>
<text x="380" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="380" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="380" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="418" y="416" font-size="12" text-anchor="middle">1</text>
<text x="474" y="416" font-size="12" text-anchor="middle" font-weight="600">3</text>
<text x="530" y="416" font-size="12" text-anchor="middle">5</text>
<text x="586" y="416" font-size="12" text-anchor="middle">7</text>
<text x="500" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<line x1="390" y1="195" x2="474" y2="195" class="gray dash"/>
<line x1="474" y1="195" x2="474" y2="395" class="gray dash"/>
<polyline points="418,95 474,195 530,295 586,395" class="curve orange"/>
<circle cx="474" cy="195" r="5" fill="#c75b12"/>
<text x="526" y="268" font-size="14" font-weight="600" style="fill:#c75b12">D<tspan dy="4" font-size="11">Nicholas</tspan></text>

<!-- Equals Sign -->
<text x="652" y="252" font-size="30" text-anchor="middle" font-weight="700">=</text>

<!-- Panel 3: Market -->
<text x="898" y="72" font-size="17" text-anchor="middle" font-weight="600">市场需求</text>
<line x1="705" y1="90" x2="705" y2="395" class="axis"/>
<line x1="705" y1="395" x2="1105" y2="395" class="axis"/>
<text x="695" y="400" font-size="12" text-anchor="end">0</text>
<text x="695" y="300" font-size="12" text-anchor="end">$1.00</text>
<text x="695" y="200" font-size="12" text-anchor="end" font-weight="600">$2.00</text>
<text x="695" y="100" font-size="12" text-anchor="end">$3.00</text>
<text x="724" y="416" font-size="12" text-anchor="middle">1</text>
<text x="838" y="416" font-size="12" text-anchor="middle" font-weight="600">7</text>
<text x="952" y="416" font-size="12" text-anchor="middle">13</text>
<text x="1066" y="416" font-size="12" text-anchor="middle">19</text>
<text x="900" y="448" font-size="14" text-anchor="middle">数量（个）</text>
<line x1="705" y1="195" x2="838" y2="195" class="gray dash"/>
<line x1="838" y1="195" x2="838" y2="395" class="gray dash"/>
<polyline points="724,95 838,195 952,295 1066,395" class="curve green"/>
<circle cx="838" cy="195" r="5.5" fill="#16805b"/>
<text x="854" y="190" font-size="14" font-weight="600" style="fill:#16805b">$2.00 时：4 + 3 = 7</text>
<text x="990" y="306" font-size="14" font-weight="600" style="fill:#16805b">D<tspan dy="4" font-size="11">市场</tspan></text>
</svg>
