<line x1="662" y1="260" x2="662" y2="222" stroke="#16805b" stroke-width="2.2" marker-end="url(#arr-up)"/>
<text x="672" y="245" font-size="13" font-weight="600" style="fill:#16805b">涨价</text>
</svg>
