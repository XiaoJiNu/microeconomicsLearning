<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">图 4-9 非均衡的市场：超额供给（过剩）与超额需求（短缺）</title><desc id="desc">（a）价格 2.50 美元高于均衡价格 2.00 美元，供给量 10 大于需求量 4，过剩 6 个推动降价；（b）价格 1.50 美元低于均衡价格，需求量 10 大于供给量 4，短缺 6 个推动涨价。</desc>
<style>text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}.axis{stroke:#344054;stroke-width:1.8}.blue{stroke:#2457a6}.red{stroke:#b33a3a}.orange{stroke:#c75b12}.green{stroke:#16805b}.gray{stroke:#667085}.curve{fill:none;stroke-width:3}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:2 4}</style>
<defs>
  <marker id="arr-dn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c75b12"/></marker>
  <marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
  <marker id="arr-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#c75b12"/></marker>
  <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c75b12"/></marker>
  <marker id="arr-gl" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L1,5 L10,9 z" fill="#16805b"/></marker>
  <marker id="arr-gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="560" y="34" font-size="22" text-anchor="middle" font-weight="600">图 4-9 非均衡的市场</text>

<!-- Panel (a): Excess Supply / Surplus -->
<text x="295" y="74" font-size="17" text-anchor="middle" font-weight="600">（a）超额供给（过剩：P = $2.50 &gt; P*）</text>
