<text x="122" y="194" font-size="13" font-weight="600" style="fill:#c75b12">降价</text>

<!-- Panel (b): Excess Demand / Shortage -->
<text x="845" y="74" font-size="17" text-anchor="middle" font-weight="600">（b）超额需求（短缺：P = $1.50 &lt; P*）</text>
<line x1="635" y1="95" x2="635" y2="415" class="axis"/>
