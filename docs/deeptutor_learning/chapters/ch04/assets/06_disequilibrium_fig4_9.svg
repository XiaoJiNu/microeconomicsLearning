<polyline points="635,415 635,365 661,315 739,265 817,215 895,165 973,115" class="curve red"/>
<circle cx="817" cy="215" r="5" fill="#17202a"/>
<circle cx="739" cy="265" r="5" fill="#b33a3a"/>
<circle cx="895" cy="265" r="5" fill="#2457a6"/>
<text x="980" y="118" font-size="14" font-weight="600" style="fill:#b33a3a">供给 S</text>
<text x="1030" y="353" font-size="14" font-weight="600" style="fill:#2457a6">需求 D</text>

<line x1="747" y1="288" x2="887" y2="288" stroke="#16805b" stroke-width="2.2" marker-start="url(#arr-gl)" marker-end="url(#arr-gr)"/>
