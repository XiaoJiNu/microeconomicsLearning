<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">图 4-1 Catherine 的需求表与需求曲线</title><desc id="desc">左侧列出每个价格下 Catherine 购买的冰淇淋蛋卷数量，右侧画出向右下方倾斜的个人需求曲线：价格从 2.00 美元降至 1.50 美元时，需求量从 4 个增至 6 个。</desc>
<style>text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}.axis{stroke:#344054;stroke-width:1.8}.grid{stroke:#e4e7ec;stroke-width:1}.blue{stroke:#2457a6}.green{stroke:#16805b}.gray{stroke:#667085}.curve{fill:none;stroke-width:3}.dash{stroke-dasharray:5 4}.tbl{stroke:#d0d5dd;stroke-width:1}</style>
<defs>
  <marker id="arr-d1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#16805b"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="440" y="36" font-size="22" text-anchor="middle" font-weight="600">图 4-1 Catherine 的需求表与需求曲线</text>

