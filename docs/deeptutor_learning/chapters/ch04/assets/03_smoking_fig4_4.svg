<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">图 4-4 减少香烟需求量的两种方法</title><desc id="desc">（a）公益警示使需求曲线从 D1 左移到 D2，4 美元下从 20 支减至 10 支；（b）加税提价从 4 美元升至 8 美元，沿 D1 从 20 支减至 12 支。</desc>
<style>text{font-family:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17202a}.axis{stroke:#344054;stroke-width:1.8}.blue{stroke:#2457a6}.orange{stroke:#c75b12}.red{stroke:#b33a3a}.gray{stroke:#667085}.curve{fill:none;stroke-width:3}.dash{stroke-dasharray:6 5}</style>
<defs>
  <marker id="arr-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c75b12"/></marker>
  <marker id="arr-along" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b33a3a"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="550" y="34" font-size="22" text-anchor="middle" font-weight="600">图 4-4 减少香烟需求量的两种方法</text>

<!-- Panel (a) -->
<text x="285" y="74" font-size="17" text-anchor="middle" font-weight="600">（a）需求曲线移动（公益广告与健康警示）</text>
<line x1="85" y1="100" x2="85" y2="415" class="axis"/>
<line x1="85" y1="415" x2="495" y2="415" class="axis"/>
<text x="75" y="420" font-size="13" text-anchor="end">0</text>
<text x="75" y="296" font-size="13" text-anchor="end">$4.00</text>
<text x="245" y="438" font-size="13" text-anchor="middle">10</text>
<text x="405" y="438" font-size="13" text-anchor="middle">20</text>
<text x="285" y="472" font-size="15" text-anchor="middle">每天吸烟量（支）</text>
<text x="24" y="258" font-size="15" text-anchor="middle" transform="rotate(-90 24 258)">每包香烟价格</text>
<line x1="85" y1="291" x2="405" y2="291" class="gray dash"/>
<line x1="245" y1="291" x2="245" y2="415" class="gray dash"/>
<line x1="405" y1="291" x2="405" y2="415" class="gray dash"/>
<polyline points="213,105 405,291 485,368.5" class="curve blue"/>
<polyline points="85,136 245,291 373,415" class="curve orange"/>
<circle cx="405" cy="291" r="5" fill="#2457a6"/>
<circle cx="245" cy="291" r="5" fill="#c75b12"/>
<text x="415" y="283" font-size="15" font-weight="600" style="fill:#2457a6">A</text>
<text x="233" y="283" font-size="15" text-anchor="end" font-weight="600" style="fill:#c75b12">B</text>
<line x1="388" y1="291" x2="264" y2="291" stroke="#c75b12" stroke-width="2.5" marker-end="url(#arr-left)"/>
<text x="326" y="276" font-size="14" text-anchor="middle" style="fill:#c75b12">政策使需求左移</text>
<text x="468" y="392" font-size="15" font-weight="600" style="fill:#2457a6">D₁</text>
<text x="332" y="396" font-size="15" text-anchor="end" font-weight="600" style="fill:#c75b12">D₂</text>

<!-- Panel (b) -->
<text x="825" y="74" font-size="17" text-anchor="middle" font-weight="600">（b）沿着需求曲线移动（提高香烟税）</text>
<line x1="625" y1="100" x2="625" y2="415" class="axis"/>
<line x1="625" y1="415" x2="1035" y2="415" class="axis"/>
<text x="615" y="420" font-size="13" text-anchor="end">0</text>
<text x="615" y="296" font-size="13" text-anchor="end">$4.00</text>
<text x="615" y="172" font-size="13" text-anchor="end">$8.00</text>
<text x="817" y="438" font-size="13" text-anchor="middle">12</text>
<text x="945" y="438" font-size="13" text-anchor="middle">20</text>
<text x="825" y="472" font-size="15" text-anchor="middle">每天吸烟量（支）</text>
<text x="564" y="258" font-size="15" text-anchor="middle" transform="rotate(-90 564 258)">每包香烟价格</text>
<line x1="625" y1="167" x2="817" y2="167" class="gray dash"/>
<line x1="817" y1="167" x2="817" y2="415" class="gray dash"/>
<line x1="625" y1="291" x2="945" y2="291" class="gray dash"/>
<line x1="945" y1="291" x2="945" y2="415" class="gray dash"/>
<polyline points="753,105 817,167 945,291 1025,368.5" class="curve blue"/>
<circle cx="945" cy="291" r="5" fill="#2457a6"/>
<circle cx="817" cy="167" r="5" fill="#b33a3a"/>
<text x="956" y="284" font-size="15" font-weight="600" style="fill:#2457a6">A</text>
<text x="805" y="160" font-size="15" text-anchor="end" font-weight="600" style="fill:#b33a3a">C</text>
<line x1="952" y1="274" x2="834" y2="160" stroke="#b33a3a" stroke-width="2.5" marker-end="url(#arr-along)"/>
<text x="904" y="208" font-size="14" text-anchor="start" style="fill:#b33a3a">税收提价：沿 D₁ 移动</text>
<text x="1008" y="392" font-size="15" font-weight="600" style="fill:#2457a6">D₁</text>
</svg>
