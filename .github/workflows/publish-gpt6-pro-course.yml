name: Publish and verify gpt6-pro course
on:
  push:
    branches: [gpt6-pro]
    paths:
      - '.github/workflows/publish-gpt6-pro-course.yml'
      - 'scripts/finalize_gpt6_pro_course.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-gpt6-pro-course
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'XiaoJiNu/microeconomicsLearning' && github.ref == 'refs/heads/gpt6-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate authored material and publish without modifying main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys, tempfile, urllib.request
          repository = 'XiaoJiNu/microeconomicsLearning'
          source = os.environ['SOURCE_COMMIT']
          url = 'https://api.github.com/repos/' + repository + '/contents/scripts/finalize_gpt6_pro_course.py?ref=' + source
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'gpt6-pro-course-publisher',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(request, timeout=60) as response:
              item = json.load(response)
          if item.get('encoding') != 'base64':
              raise RuntimeError('Unexpected source encoding')
          code = base64.b64decode(item['content']).decode('utf-8')
          # All new text is already authored; GitHub deduplicates unchanged blobs.
          # Avoid a second network read of every original lesson during publication.
          code = code.replace(
              "for p,text in contents.items()\n           if p not in entries or p not in course_paths or text != blob_text(entries[p]['sha'])]",
              "for p,text in contents.items()]"
          )
          with tempfile.TemporaryDirectory(prefix='publish-course-') as directory:
              path = pathlib.Path(directory) / 'publish.py'
              path.write_text(code, encoding='utf-8')
              subprocess.run([sys.executable, str(path)], check=True)
          PY
